<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tally</title>
<meta name="description" content="Score any game and track every player's stats.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tally">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: iOS inset-grouped app in a single phone-width column, large titles, translucent tab bar, bottom sheets */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --sheet:#F2F2F7; --sheetcard:#FFFFFF;
  --fill:rgba(118,118,128,.12); --label:#000000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.24); --accent:#007AFF; --tint:rgba(0,122,255,.10);
  --green:#248A3D; --red:#FF3B30; --gold:#C77C02; --goldbg:rgba(255,159,10,.16);
  --bar:rgba(249,249,250,.86); --scrim:rgba(0,0,0,.3); --onaccent:#FFFFFF; --segon:#FFFFFF;
  --sky1:#BFDBFF; --sky2:#EEF5FF; --rock:#8C98AE; --rock2:#66728A; --snow:#FFFFFF; --lane1:#E9EEF6; --lane2:#F4F7FB; --heat1:#FBEDE6; --heat2:#FFF6F1; --safe:rgba(52,199,89,.35); --safe2:#248A3D; --pro1:#FF9F0A; --pro2:#FF375F;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;
  --rounded:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --gut-l:max(16px,env(safe-area-inset-left,0px)); --gut-r:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1C1C1E; --sheet:#1C1C1E; --sheetcard:#2C2C2E;
  --fill:rgba(118,118,128,.24); --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.6); --accent:#0A84FF; --tint:rgba(10,132,255,.18);
  --green:#30D158; --red:#FF453A; --gold:#FFB340; --goldbg:rgba(255,159,10,.2);
  --bar:rgba(22,22,24,.84); --scrim:rgba(0,0,0,.5); --segon:#636366;
  --sky1:#0A1430; --sky2:#1E2B4D; --rock:#465169; --rock2:#2E3649; --snow:#DCE5F2; --lane1:#1C1C1E; --lane2:#242427; --heat1:#2A1712; --heat2:#21130F; --safe:rgba(48,209,88,.3); --safe2:#1F7A35; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --sheet:#1C1C1E; --sheetcard:#2C2C2E;
  --fill:rgba(118,118,128,.24); --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.6); --accent:#0A84FF; --tint:rgba(10,132,255,.18);
  --green:#30D158; --red:#FF453A; --gold:#FFB340; --goldbg:rgba(255,159,10,.2);
  --bar:rgba(22,22,24,.84); --scrim:rgba(0,0,0,.5); --segon:#636366;
  --sky1:#0A1430; --sky2:#1E2B4D; --rock:#465169; --rock2:#2E3649; --snow:#DCE5F2; --lane1:#1C1C1E; --lane2:#242427; --heat1:#2A1712; --heat2:#21130F; --safe:rgba(48,209,88,.3); --safe2:#1F7A35; color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--label);font-family:var(--font);font-size:17px;line-height:1.3;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding-left:var(--gut-l);padding-right:var(--gut-r);padding-block:0 calc(110px + env(safe-area-inset-bottom,0px))}

/* titles */
.lt{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:18px 6px}
.lt h1{margin:0;font-family:var(--display);font-size:34px;line-height:41px;font-weight:700;letter-spacing:.2px}
.sh{margin:26px 4px 8px;font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:.2px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sh small{font-family:var(--font);font-size:13px;font-weight:400;color:var(--label2)}
.foot{margin:8px 16px 0;font-size:13px;color:var(--label2);line-height:1.4}
.icon-btn{width:34px;height:34px;border-radius:50%;border:0;background:var(--fill);color:var(--accent);display:grid;place-items:center;margin-bottom:4px;flex:none}
.icon-btn svg{width:18px;height:18px}

/* nav bar for pushed views */
.navbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:44px;
  margin-left:calc(-1 * var(--gut-l));margin-right:calc(-1 * var(--gut-r));padding-left:calc(var(--gut-l) - 8px);padding-right:var(--gut-r);
  background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep)}
.nav-back{display:flex;align-items:center;gap:2px;border:0;background:none;color:var(--accent);padding:8px 4px;justify-self:start;max-width:100%;min-width:0}
.nav-back span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-back svg{width:13px;height:21px;flex:none}
.nav-title{font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:min(40vw,240px)}
.nav-right{justify-self:end}
.nav-btn{border:0;background:none;color:var(--accent);padding:8px 0;font-weight:600}
.nav-btn:disabled{color:var(--label3)}

/* groups and rows */
.group{background:var(--card);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:10px 16px;border:0;background:none;text-align:left;position:relative}
.row + .row::before{content:"";position:absolute;top:0;right:0;left:var(--inset,64px);height:.5px;background:var(--sep)}
.group.plain .row + .row::before{left:16px}
button.row:active{background:var(--fill)}
.grow{flex:1;min-width:0}
.t1{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:13px;color:var(--label2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:15px;color:var(--label2);font-variant-numeric:tabular-nums;white-space:nowrap}
.chev{width:8px;height:14px;color:var(--label3);flex:none}
.accent{color:var(--accent)}
.danger{color:var(--red)}
.center{justify-content:center;text-align:center}

.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#FFFFFF;font-weight:600;font-size:14px;flex:none;letter-spacing:.3px}
.avatar.sm{width:24px;height:24px;font-size:10px}
.avatar.xl{width:96px;height:96px;font-size:36px}
.avatar.photo{background:var(--fill);overflow:hidden}
.avatar.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo-pick{position:relative;cursor:pointer;display:block;border-radius:50%}
.photo-pick .cam{position:absolute;right:-2px;bottom:-2px;width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--onaccent);display:grid;place-items:center;box-shadow:0 0 0 3px var(--sheet)}
.photo-pick .cam svg{width:17px;height:17px}
.photo-pick .cam svg circle:nth-of-type(1){fill:var(--accent)}
.photo-actions{display:flex;gap:20px;align-items:center;font-size:17px}
.photo-actions label{cursor:pointer}
.sw{width:44px;height:44px}
.stack{display:flex;flex:none}
.stack .avatar{box-shadow:0 0 0 2px var(--card)}
.stack .avatar + .avatar{margin-left:-7px}
.gicon{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:#FFFFFF;font-family:var(--rounded);font-weight:700;font-size:14px;flex:none}
.gicon.lg{width:64px;height:64px;border-radius:15px;font-size:24px}
.gicon.add{background:var(--fill);color:var(--accent)}
.gicon.add svg{width:18px;height:18px}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tiles.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.tile{background:var(--card);border-radius:12px;padding:12px 14px}
.tile .v{font-family:var(--rounded);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .v small{font-size:15px;font-weight:600;color:var(--label2);margin-left:2px}
.tile .k{font-size:13px;color:var(--label2);margin-top:3px}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-left:calc(-1 * var(--gut-l));margin-right:calc(-1 * var(--gut-r));padding:4px var(--gut-r) 4px var(--gut-l)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:999px;padding:7px 14px;background:var(--card);font-size:15px;font-weight:500}
.chip.on{background:var(--accent);color:var(--onaccent)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border:0;border-radius:14px;font-size:17px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--onaccent)}
.btn.primary:disabled{opacity:.4}
.btn.secondary{background:var(--tint);color:var(--accent)}
.btn svg{width:18px;height:18px}
.pill{border:0;border-radius:999px;background:var(--accent);color:var(--onaccent);padding:7px 14px;font-size:15px;font-weight:600;flex:none}
.stackgap{display:grid;gap:10px;margin-top:16px}

/* play view */
.play-head{padding:14px 4px 10px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--label2)}
.goal{font-size:15px;color:var(--label2);margin-top:2px}
.score-row{display:grid;grid-template-columns:22px 36px minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 16px;position:relative}
.score-row + .score-row::before{content:"";position:absolute;top:0;right:0;left:86px;height:.5px;background:var(--sep)}
.place{font-family:var(--rounded);font-weight:700;color:var(--label2);text-align:center;font-variant-numeric:tabular-nums}
.place.first{color:var(--gold)}
.total{font-family:var(--rounded);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;min-width:2.5ch}
.prog{height:4px;border-radius:2px;background:var(--fill);margin-top:7px;overflow:hidden}
.prog i{display:block;height:100%;border-radius:2px;background:var(--accent)}
.prog.low i{background:var(--gold)}
.delta{font-variant-numeric:tabular-nums}
.delta.up{color:var(--green)} .delta.down{color:var(--red)}
.banner{display:flex;align-items:center;gap:12px;background:var(--tint);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:15px}
.banner .grow{line-height:1.35}

/* table */
.tbl-wrap{background:var(--card);border-radius:12px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th,td{padding:9px 12px;text-align:right;white-space:nowrap}
thead th{font-size:12px;font-weight:600;color:var(--label2);border-bottom:.5px solid var(--sep)}
thead th .avatar{margin-left:auto;margin-bottom:3px}
tbody th{font-weight:400;color:var(--label2);text-align:left;font-size:13px}
tbody tr + tr td,tbody tr + tr th{border-top:.5px solid var(--sep)}
td.hi{color:var(--accent);font-weight:600}
tfoot th,tfoot td{font-weight:700;border-top:1px solid var(--sep);font-family:var(--rounded)}
tfoot th{text-align:left}
.link-btn{border:0;background:none;color:var(--accent);padding:10px 4px;font-size:15px}

/* leaderboard */
.rank{width:22px;text-align:center;font-family:var(--rounded);font-weight:700;color:var(--label2);flex:none;font-variant-numeric:tabular-nums}
.rank.r1{color:var(--gold)}
.pct{width:74px;flex:none;text-align:right}
.pct b{font-family:var(--rounded);font-size:17px;font-variant-numeric:tabular-nums}
.pct .prog{margin-top:5px}
.badge{font-size:13px;font-weight:600;border-radius:7px;padding:3px 8px;background:var(--fill);color:var(--label2);font-variant-numeric:tabular-nums;flex:none}
.badge.win{background:var(--goldbg);color:var(--gold)}
.rec{font-size:15px;text-align:right;flex:none;max-width:55%}
.rec b{font-family:var(--rounded);font-variant-numeric:tabular-nums}
.rec div{font-size:13px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* player hero + chart */
.hero{display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px 0 18px;text-align:center}
.hero h2{margin:4px 0 0;font-family:var(--display);font-size:28px;font-weight:700;text-wrap:balance}
.hero p{margin:0;color:var(--label2);font-size:15px}
.card{background:var(--card);border-radius:12px;padding:14px 16px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card-h b{font-size:15px} .card-h span{font-size:13px;color:var(--label2)}
.spark{display:block;width:100%;height:auto;margin-top:8px}
.spark text{fill:var(--label2);font-size:11px;font-family:var(--font)}
.spark .grid{stroke:var(--sep);stroke-width:1}
.spark .line{stroke:var(--accent);stroke-width:2.5;fill:none;stroke-linejoin:round;stroke-linecap:round}
.spark .area{fill:var(--accent);opacity:.12}
.spark .dot{fill:var(--card);stroke:var(--accent);stroke-width:2}
.spark .dot.win{fill:var(--gold);stroke:var(--gold)}

.empty{text-align:center;padding:48px 24px;color:var(--label2)}
.empty b{display:block;color:var(--label);font-size:20px;margin-bottom:6px;font-family:var(--display)}
.empty p{margin:0 0 18px;font-size:15px;line-height:1.4}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--sep);padding-left:var(--gut-l);padding-right:var(--gut-r);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;color:var(--label2);font-size:10px;font-weight:500}
.tab svg{width:26px;height:24px}
.tab.on{color:var(--accent)}

/* sheets */
.sheet-wrap{position:fixed;inset:0;z-index:40}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .25s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;max-height:92%;overflow-y:auto;background:var(--sheet);border-radius:14px 14px 0 0;
  transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);padding-left:var(--gut-l);padding-right:var(--gut-r);padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.sheet-wrap.open .scrim{opacity:1}
.sheet-wrap.open .sheet{transform:none}
.sheet .group,.sheet .card{background:var(--sheetcard)}
.sheet .stack .avatar{box-shadow:0 0 0 2px var(--sheetcard)}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--label3);margin:6px auto 0}
.sheet-h{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:52px;background:var(--sheet);
  margin-left:calc(-1 * var(--gut-l));margin-right:calc(-1 * var(--gut-r));padding-left:var(--gut-l);padding-right:var(--gut-r)}
.sheet-h .l{justify-self:start} .sheet-h .r{justify-self:end}
.sheet-h b{font-weight:600}
.sheet-h button{border:0;background:none;color:var(--accent);padding:8px 0}
.sheet-h .r button{font-weight:600}
.sheet-h button:disabled{color:var(--label3)}
.hint{font-size:13px;color:var(--label2);margin:4px 4px 12px;line-height:1.4}

input[type=text],input[type=number]{font:inherit;color:var(--label);background:transparent;border:0;outline:0;min-width:0}
input::placeholder{color:var(--label3)}
.field{flex:1;font-size:17px;padding:2px 0}
.field.right{text-align:right}
.num-in{width:96px;flex:none;text-align:right;background:var(--fill);border-radius:10px;padding:8px 12px;font-family:var(--rounded);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.num-in:focus{box-shadow:0 0 0 2px var(--accent)}
.sign{width:40px;height:38px;border:0;border-radius:10px;background:var(--fill);color:var(--label2);font-size:15px;font-weight:600;flex:none}
.check{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--label3);display:grid;place-items:center;flex:none;font-size:13px;font-weight:700;color:var(--onaccent);font-variant-numeric:tabular-nums}
.check.on{background:var(--accent);border-color:var(--accent)}
.swatches{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;padding:16px 18px}
.sw{border-radius:50%;border:0;padding:0;position:relative}
.sw.on::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2.5px solid var(--label3)}
.switch{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;flex:none;cursor:pointer;transition:background .2s;margin:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#FFFFFF;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .2s}
.switch:checked{background:#34C759}
.switch:checked::after{transform:translateX(20px)}
.add-btn{border:0;background:none;color:var(--accent);font-weight:600;padding:4px 0}
.add-btn.danger{color:var(--red)}
.add-btn:disabled{color:var(--label3)}

.result{text-align:center;padding:10px 0 18px}
.trophy{width:72px;height:72px;border-radius:50%;background:var(--goldbg);color:var(--gold);display:grid;place-items:center;margin:8px auto 12px}
.trophy svg{width:36px;height:36px}
.result h2{margin:0;font-family:var(--display);font-size:26px;font-weight:700;text-wrap:balance}
.result p{margin:4px 0 0;color:var(--label2);font-size:15px}

.action-title{padding:16px;text-align:center;font-size:13px;color:var(--label2);line-height:1.4}
.action-title b{display:block;color:var(--label);font-size:15px;margin-bottom:2px}
.action-btn{width:100%;border:0;border-top:.5px solid var(--sep);background:none;padding:16px;font-size:18px;color:var(--red)}
.action-cancel{margin-top:8px;width:100%;border:0;border-radius:12px;background:var(--sheetcard);padding:16px;font-size:18px;font-weight:600;color:var(--accent)}

.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--label);color:var(--bg);
  padding:10px 16px;border-radius:999px;font-size:15px;font-weight:500;max-width:calc(100% - 32px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 6px 24px rgba(0,0,0,.18)}

/* featured-game entry */
.tag{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--accent);background:var(--tint);border-radius:5px;padding:2px 6px;flex:none}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:none;padding:7px 6px;border-radius:7px;font-size:13px;font-weight:600;color:var(--label)}
.seg button.on{background:var(--segon);box-shadow:0 1px 4px rgba(0,0,0,.14)}
.seg-wrap{display:grid;gap:6px;margin-bottom:6px}
.seg-wrap .lbl{font-size:13px;color:var(--label2);margin:0 4px}
.pcard{margin-bottom:12px}
.phead{border-bottom:.5px solid var(--sep)}
.live{font-family:var(--rounded);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.fgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.frow{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:10px 16px;min-height:52px;border:0;background:none;text-align:left;width:100%;color:inherit}
.frow + .frow{border-top:.5px solid var(--sep)}
.frow.half{grid-column:span 3;flex-direction:column;align-items:stretch;gap:6px;padding:10px 12px}
.frow.third{grid-column:span 2;flex-direction:column;align-items:stretch;gap:6px;padding:10px 8px}
.frow.half + .frow.half:nth-child(even),.frow.third:not(:first-child){border-left:.5px solid var(--sep)}
.fl{flex:1;min-width:0;font-size:16px}
.fl label{display:block}
.frow.half .fl,.frow.third .fl{font-size:14px;text-align:center}
.frow.third .fl .t2{font-size:12px}
.stepper{display:flex;align-items:center;background:var(--fill);border-radius:10px;flex:none;overflow:hidden}
.stepper button{width:38px;height:38px;border:0;background:none;color:var(--accent);font-size:22px;font-weight:500;line-height:1;flex:none}
.stepper button:active{background:var(--fill)}
.stepper input{width:44px;text-align:center;font-family:var(--rounded);font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;padding:0}
.frow.third .stepper button{width:30px}
.frow.third .stepper input{width:100%;flex:1}
.frow.half .stepper input{flex:1}
.frow.tog .check{width:28px;height:28px}
.rsum{background:var(--tint);border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.4;margin-bottom:12px}
.rsum:empty{display:none}
.mk{font-style:normal;color:var(--gold);font-size:12px;margin-left:3px}
.mk2{display:block;font-size:11px;color:var(--label2)}
.mk2.ok{color:var(--green)}
.chips.wrap{flex-wrap:wrap;margin:0;padding:0;overflow:visible}
.sheet .chip{background:var(--sheetcard)}
.sheet .chip.on{background:var(--accent);color:var(--onaccent)}
.chip b{font-family:var(--rounded);margin-left:4px;font-variant-numeric:tabular-nums}
.menu-g{margin-bottom:12px}
.menu-g .lbl{font-size:13px;color:var(--label2);margin:0 4px 6px;display:flex;justify-content:space-between}
.duo{display:flex;align-items:center}
.duo .gicon{margin-left:-14px;box-shadow:0 0 0 3px var(--bg)}
.avatar.lg{width:64px;height:64px;font-size:24px}
.tile .v.txt{font-size:20px;padding-top:5px}
.total small{font-size:15px;color:var(--label2);font-weight:600}
/* yahtzee */
table.yz th,table.yz td{padding:0 8px;height:38px}
table.yz td{padding:2px 3px}
table.yz tbody th{color:var(--label);font-size:14px}
table.yz tr.sub th,table.yz tr.sub td{color:var(--label2);font-size:13px;background:var(--fill);padding:0 8px}
.yc{width:100%;min-width:46px;height:34px;border:0;border-radius:8px;background:none;font-family:var(--rounded);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.yc.blank{color:var(--label3)}
.yc.bonus{color:var(--gold)}
th.next,td.next{background:var(--tint)}
th.next span{display:block;color:var(--accent);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{border:0;border-radius:12px;background:var(--sheetcard);padding:12px 6px;display:grid;gap:2px;text-align:center}
.opt b{font-family:var(--rounded);font-size:24px;font-variant-numeric:tabular-nums}
.opt span{font-size:12px;color:var(--label2)}
.opt.on{background:var(--accent);color:var(--onaccent)}
.opt.on span{color:var(--onaccent);opacity:.85}
.boxwho{display:flex;align-items:center;gap:10px;justify-content:center;margin:4px 0 14px;font-size:17px}
.free{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:12px}
.free .stepper button{width:52px;height:52px;font-size:28px}
.free .stepper input{width:70px;font-size:28px}
.ins td{font-family:var(--rounded);font-weight:600}
.ins td.hi{color:var(--gold)}
.ins tbody th{white-space:normal;min-width:120px}

/* rules */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px;margin-bottom:12px}
.facts div{background:var(--card);border-radius:12px;padding:10px 12px;display:grid;gap:2px;min-width:0}
.sheet .facts div{background:var(--sheetcard)}
.facts span{font-size:12px;color:var(--label2)}
.facts b{font-size:15px;font-weight:600;line-height:1.25}
.search{width:100%;font:inherit;font-size:17px;color:var(--label);background:var(--fill);border:0;border-radius:10px;padding:9px 12px;outline:0;-webkit-appearance:none;appearance:none}
.search:focus{box-shadow:0 0 0 2px var(--accent)}
.rsearch{margin-bottom:2px}
.card.rule{display:grid;gap:10px}
.card.rule p{margin:0;font-size:16px;line-height:1.45}
details.qa{padding:0 16px;position:relative}
details.qa + details.qa{border-top:.5px solid var(--sep)}
details.qa summary{list-style:none;cursor:pointer;padding:13px 26px 13px 0;font-size:16px;font-weight:500;line-height:1.35;position:relative}
details.qa summary::-webkit-details-marker{display:none}
details.qa summary::after{content:"";position:absolute;right:4px;top:50%;width:7px;height:7px;border-right:2px solid var(--label3);border-bottom:2px solid var(--label3);transform:translateY(-70%) rotate(45deg);transition:transform .2s}
details.qa[open] summary::after{transform:translateY(-30%) rotate(-135deg)}
details.qa p{margin:0 0 14px;color:var(--label2);font-size:15px;line-height:1.45}
a.row{text-decoration:none;color:inherit}
.ext{color:var(--accent);font-size:18px;flex:none}
.ibook{width:20px;height:20px;flex:none}
.inline-link{border:0;background:none;color:var(--accent);font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:5px;padding:4px 2px}
.inline-link .ibook{width:17px;height:17px}
.hint .inline-link{font-size:13px;padding:0 2px;vertical-align:baseline}
.hint .inline-link .ibook{width:14px;height:14px}
.nav-pair{display:flex;align-items:center;gap:16px}
.nav-btn.icon{display:grid;place-items:center;padding:8px 2px}
.nav-btn.icon .ibook{width:23px;height:23px}
tr.tap{cursor:pointer}
tr.tap:active td,tr.tap:active th{background:var(--fill)}
/* library */
.lib-top{display:grid;gap:10px;padding:12px 0 14px}
.lrow{padding:0 12px 0 0}
.lmain{flex:1;min-width:0;display:flex;align-items:center;gap:12px;border:0;background:none;text-align:left;padding:10px 0 10px 16px;color:inherit}
.lmain:active{opacity:.6}
.addbtn{flex:none;border:0;border-radius:999px;background:var(--fill);color:var(--accent);font-size:15px;font-weight:600;padding:6px 14px;min-width:70px}
.addbtn.on{background:var(--tint)}
.info-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 2px}
.info-actions .btn{font-size:15px;height:46px;padding:0 8px}
textarea{display:block;width:100%;font:inherit;font-size:16px;line-height:1.45;color:var(--label);background:transparent;border:0;outline:0;resize:vertical;padding:12px 16px;min-height:150px}
textarea::placeholder{color:var(--label3)}
.frow.tog:disabled{opacity:.55}
.frow.tog:disabled .check{opacity:.5}

/* settings + pro */
.pro-card{display:flex;align-items:center;gap:14px;width:100%;border:0;border-radius:14px;padding:14px 16px;margin-top:10px;text-align:left;color:var(--label);background:var(--card)}
.pro-card .grow{display:grid;gap:2px}
.pro-card b{font-size:17px}
.pro-card .grow span{font-size:13px;color:var(--label2);line-height:1.35}
.pro-badge{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#FFFFFF;background:linear-gradient(135deg,var(--pro1),var(--pro2));flex:none}
.pro-badge svg{width:26px;height:26px}
.pro-badge.lg{width:72px;height:72px;border-radius:18px}
.pro-badge.lg svg{width:42px;height:42px}
.pro-hero{display:grid;justify-items:center;gap:6px;text-align:center;padding:4px 0 16px}
.pro-hero h2{margin:6px 0 0;font-family:var(--display);font-size:28px}
.pro-hero p{margin:0;color:var(--label2)}
.pro-tbl td{text-align:center;font-size:14px}
.pro-tbl tbody th{color:var(--label);font-size:14px}
.pro-tbl td.hi{color:var(--accent);font-weight:600}
.lrow.flash{animation:flash 1s ease-out}
@keyframes flash{0%{background:var(--tint)}100%{background:transparent}}
.btn svg{width:16px;height:16px}

/* replay */
body.noscroll{overflow:hidden}
.replay{position:fixed;inset:0;z-index:70;background:var(--bg);overflow-y:auto;opacity:0;transition:opacity .2s;
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:var(--gut-l);padding-right:var(--gut-r);
  display:flex;flex-direction:column;gap:12px}
.replay.on{opacity:1}
.replay > *{width:100%;max-width:520px;margin-left:auto;margin-right:auto}
.rp-top{display:flex;align-items:flex-start;gap:12px}
.rp-round{font-family:var(--display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:2px}
.rp-skip{border:0;border-radius:999px;background:var(--fill);color:var(--accent);font-weight:600;font-size:15px;padding:8px 16px;flex:none;margin-top:4px}
.rp-stage{position:relative;border-radius:16px;overflow:hidden;flex:none}
.rp-stage .tok{transition:left var(--ms) cubic-bezier(.45,.05,.3,1),top var(--ms) cubic-bezier(.45,.05,.3,1)}
.rp-stage.instant .tok{transition:none}
.tok{display:grid;justify-items:center;gap:2px;width:64px;position:absolute}
.tok .avatar{width:38px;height:38px;box-shadow:0 0 0 3px var(--card),0 3px 10px rgba(0,0,0,.18);transition:box-shadow .3s}
.tok.leading .avatar{box-shadow:0 0 0 3px var(--gold),0 3px 10px rgba(0,0,0,.18)}
.tok.winner .avatar{box-shadow:0 0 0 4px var(--gold),0 0 0 9px var(--goldbg)}
.tok-score{font-family:var(--rounded);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;background:var(--label);color:var(--bg);border-radius:999px;padding:1px 7px;line-height:16px;white-space:nowrap}
.tok.leading .tok-score{background:var(--gold);color:#FFFFFF}
.tok-name{font-size:11px;font-weight:600;max-width:64px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--label)}
.track{position:relative;padding:8px 0;background:var(--card)}
.lane{position:relative;height:var(--lane);margin:0 6px;overflow:hidden}
.lane:nth-child(odd){background:var(--lane1)} .lane:nth-child(even){background:var(--lane2)}
.lane + .lane{border-top:1.5px dashed var(--sep)}
.lane::before{content:"";position:absolute;top:0;bottom:0;left:29px;width:2px;background:var(--accent);opacity:.45}
.lane::after{content:"";position:absolute;top:0;bottom:0;left:calc(86% - 5px);width:10px;background:repeating-conic-gradient(var(--label) 0 25%,var(--card) 0 50%) 0 0/10px 10px;opacity:.8}
.track .tok{top:50%;left:calc(var(--x,0) * (86% - 30px));transform:translateY(-50%);width:60px;z-index:1}
.track .tok .tok-score{position:absolute;top:-3px;left:calc(50% + 9px);z-index:1;padding:0 6px;font-size:11px;line-height:15px}
.track .tok .avatar{width:36px;height:36px}
.track .tok .tok-name{max-width:58px;font-size:10px}
.track.sm .tok .avatar{width:30px;height:30px;font-size:11px}
.offarrow{position:absolute;left:4px;top:50%;transform:translateY(-50%);z-index:2;display:flex;align-items:center;gap:4px;background:var(--red);color:#FFFFFF;border-radius:999px;padding:4px 9px 4px 7px;font-size:11px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.2);animation:nudge 1.2s ease-in-out infinite}
.offarrow b{font-family:var(--rounded);font-variant-numeric:tabular-nums}
@keyframes nudge{50%{transform:translate(-3px,-50%)}}
/* hanging over lava: a deliberately dark scene in both themes */
.hang{position:relative;height:clamp(340px,52vh,440px);overflow:hidden;background:radial-gradient(120% 70% at 50% 100%,#7A1E08 0%,#3A130B 45%,#1A0F0D 100%)}
.beam{position:absolute;left:0;right:0;top:4%;height:14px;z-index:1;box-shadow:0 4px 10px rgba(0,0,0,.55);
  background:radial-gradient(circle,#2A201C 0 2px,transparent 2.6px) 0 50%/28px 14px repeat-x,linear-gradient(#7D6B61,#43362F)}
.hp{position:absolute;top:0;bottom:0;left:var(--cx);width:0}
.hp .rope{position:absolute;left:-1px;top:calc(4% + 10px);width:2px;height:calc(var(--ty,22%) - 4% - 2px);background:repeating-linear-gradient(#D7B48C 0 5px,#9A7650 5px 8px);transition:height var(--ms) cubic-bezier(.45,.05,.3,1)}
.hang .tok{top:var(--ty,22%);left:0;transform:translateX(-50%);width:auto;z-index:2}
.hang .tok-name{color:#FFFFFF;text-shadow:0 1px 3px #000;font-size:11px}
.hang .tok-score{background:#FFFFFF;color:#1C1C1E}
.hang .tok .avatar{box-shadow:0 0 0 3px #1A0F0D,0 4px 12px rgba(0,0,0,.5)}
.hang .tok.leading .avatar{box-shadow:0 0 0 3px var(--gold),0 0 16px rgba(255,190,60,.55)}
.hang .tok.winner .avatar{box-shadow:0 0 0 4px #FFC24A,0 0 26px 6px rgba(255,200,80,.7)}
.hang.sm .tok .avatar{width:30px;height:30px;font-size:11px}
.hang.sm .tok-name{max-width:42px;font-size:10px}
.hp.fell .tok{top:104%;opacity:0;transform:translateX(-50%) rotate(26deg) scale(.7);transition:top .75s cubic-bezier(.55,0,1,.45),opacity .35s .45s,transform .75s ease-in}
.hp.fell .rope{height:16px;opacity:.6;transition:height .18s,opacity .18s}
.rp-stage.instant .tok,.rp-stage.instant .rope{transition:none!important}
.pool{position:absolute;left:0;right:0;bottom:0;height:20%;z-index:3;background:linear-gradient(#FF9A2E,#F0530F 22%,#B32507 60%,#5E0F00);box-shadow:0 -14px 40px 6px rgba(255,98,20,.5)}
.pool-surf{position:absolute;left:0;right:0;top:-9px;height:18px;background:radial-gradient(circle at 50% 100%,#FFB13B 0 9px,transparent 10px) 0 0/22px 18px repeat-x;animation:surf 2.4s linear infinite}
@keyframes surf{to{background-position:22px 0}}
.pool .bubbles i{right:auto}
.splash{position:absolute;top:80%;z-index:4;width:0;height:0}
.splash i{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:#FFC24A;animation:drop .8s ease-out forwards}
.splash i:nth-child(1){--dx:-26px;--dy:-34px}.splash i:nth-child(2){--dx:-10px;--dy:-48px}.splash i:nth-child(3){--dx:4px;--dy:-54px}.splash i:nth-child(4){--dx:18px;--dy:-42px}.splash i:nth-child(5){--dx:30px;--dy:-26px}
@keyframes drop{40%{transform:translate(var(--dx),var(--dy));opacity:1}100%{transform:translate(calc(var(--dx) * 1.4),10px);opacity:0}}
.rp-call{min-height:52px;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--display);font-size:20px;font-weight:600;line-height:1.25;text-wrap:balance;padding:0 8px}
.rp-call.lead{color:var(--gold)}
.rp-call.pop{animation:pop .35s ease-out}
@keyframes pop{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:none}}
.rp-bar{height:4px;border-radius:2px;background:var(--fill);overflow:hidden;flex:none}
.rp-bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s}
.rp-end{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:200}
.confetti i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall 2.2s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes fall{to{transform:translate(var(--dx),460px) rotate(var(--rot));opacity:0}}

/* round sheet tools */
.sheet-tools{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-bottom:12px}
.tool-btn{width:40px;height:34px;border:0;border-radius:9px;background:var(--fill);color:var(--accent);display:grid;place-items:center}
.tool-btn .ibook{width:20px;height:20px}
/* rulebook */
.rb{--gcs:color-mix(in srgb,var(--gc) 14%,transparent)}
.rb-cover{display:flex;align-items:center;gap:14px;padding:14px 2px 14px}
.rb-cover h2{margin:0;font-family:var(--display);font-size:28px;font-weight:800;letter-spacing:-.2px;line-height:1.1;text-wrap:balance}
.rb-cover p{margin:4px 0 0;color:var(--label2);font-size:14px}
.rb-kicker{font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--gc)}
.toc{background:var(--card);border-radius:12px;overflow:hidden;margin:12px 0}
.sheet .toc{background:var(--sheetcard)}
.toc-h{font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--label2);padding:12px 16px 6px}
.toc-row{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:9px 16px;text-align:left;font-size:16px;color:var(--label);position:relative}
.toc-row + .toc-row::before{content:"";position:absolute;top:0;left:52px;right:0;height:.5px;background:var(--sep)}
.toc-row:active{background:var(--fill)}
.num{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--rounded);font-size:13px;font-weight:700;background:var(--gcs);color:var(--gc);font-variant-numeric:tabular-nums}
.rb-sec{scroll-margin-top:calc(64px + env(safe-area-inset-top,0px));margin-top:22px}
.rb-h{display:flex;align-items:center;gap:10px;margin:0 0 10px;padding-bottom:8px;border-bottom:2px solid var(--gc);font-family:var(--display);font-size:20px;font-weight:700}
.rb-h .num{background:var(--gc);color:#FFFFFF}
.rb-body{background:var(--card);border-radius:12px;padding:14px 16px;display:grid;gap:10px}
.sheet .rb-body{background:var(--sheetcard)}
.rb-body p{margin:0;font-size:16px;line-height:1.45}
.rb-body p.lead{font-weight:600}
.steps{margin:0;padding:0;list-style:none;counter-reset:st;display:grid;gap:10px}
.steps li{counter-increment:st;display:grid;grid-template-columns:24px 1fr;gap:10px;font-size:16px;line-height:1.45}
.steps li::before{content:counter(st);width:22px;height:22px;margin-top:1px;border-radius:6px;display:grid;place-items:center;font-family:var(--rounded);font-size:12px;font-weight:700;background:var(--gcs);color:var(--gc)}
.bul{margin:0;padding:0;list-style:none;display:grid;gap:9px}
.bul li{display:grid;grid-template-columns:14px 1fr;gap:8px;font-size:16px;line-height:1.45}
.bul li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gc,var(--accent));margin-top:9px;justify-self:center}
.chart{width:100%;border-collapse:collapse;font-size:15px}
.chart th,.chart td{padding:9px 0;white-space:normal;vertical-align:top}
.chart th{text-align:left;font-weight:500;color:var(--label);padding-right:12px}
.chart td{text-align:right;font-family:var(--rounded);font-weight:700;color:var(--gc)}
.chart tr + tr th,.chart tr + tr td{border-top:.5px solid var(--sep)}
.qa-sec .rb-body{padding:0 0;gap:0}
.qa-sec details.qa{padding:0 16px}
/* lava race */
.lava-track .lane:nth-child(odd){background:var(--heat1)} .lava-track .lane:nth-child(even){background:var(--heat2)}
.lava-track .tok{z-index:2}
.lava{position:absolute;left:0;top:0;bottom:0;z-index:1;width:max(6px,calc(var(--lx,0) * (100% - 144px) - 10px));transition:width var(--ms) cubic-bezier(.45,.05,.3,1);
  background:linear-gradient(90deg,#5E0F00 0%,#C42A06 40%,#F0530F 75%,#FF8A1F 100%);box-shadow:0 0 26px 8px rgba(255,98,20,.45)}
.rp-stage.instant .lava{transition:none}
.lava::after{content:"";position:absolute;top:0;bottom:0;right:-10px;width:20px;
  background:radial-gradient(circle at 50% 50%,#FFB13B 0 7px,#FF8A1F 8px 9px,transparent 10px) 0 0/20px 19px repeat-y;animation:ooze 1.6s linear infinite}
@keyframes ooze{to{background-position:0 19px}}
.bubbles{position:absolute;inset:0;overflow:hidden}
.bubbles i{position:absolute;right:16px;width:var(--s);height:var(--s);border-radius:50%;background:#FFC24A;opacity:.85;animation:bubble 2.2s ease-in-out infinite}
@keyframes bubble{0%,100%{transform:translate(0,0) scale(.4);opacity:0}40%{opacity:.9}70%{transform:translate(-14px,-6px) scale(1);opacity:.7}}
.safe{position:absolute;top:8px;bottom:8px;right:6px;width:22px;border-radius:5px;background:repeating-linear-gradient(-45deg,var(--safe) 0 6px,transparent 6px 12px);display:grid;place-items:center}
.safe span{writing-mode:vertical-rl;font-size:10px;font-weight:800;letter-spacing:2px;color:#FFFFFF;background:var(--safe2);border-radius:4px;padding:6px 2px}
.tok.hit .avatar{animation:scorch .7s ease-out}

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const COLORS = ['#007AFF','#34C759','#FF9500','#FF2D55','#AF52DE','#00A5A8'];

const TEMPLATES = [
  {id:'blitz', feat:true, name:'Dutch Blitz', short:'DB', color:'#FF9500', target:75, low:false, min:2, max:8, blurb:'First to 75 · tracks every Blitz'},
  {id:'fivecrowns', feat:true, name:'Five Crowns', short:'5C', color:'#B07D00', rounds:11, low:true, min:2, max:7, blurb:'11 rounds · lowest wins · tracks who goes out'},
  {id:'wizard', feat:true, name:'Wizard', short:'Wz', color:'#4040C8', low:false, min:3, max:6, blurb:'Bid your tricks · tracks bid accuracy'},
  {id:'sushi', feat:true, name:'Sushi Go!', short:'SG', color:'#EE5A52', rounds:3, low:false, min:2, max:8, blurb:'Original or Party · scores every dish for you'},
  {id:'qwirkle', feat:true, name:'Qwirkle', short:'Qw', color:'#13866A', low:false, min:2, max:4, blurb:'Turn by turn · tracks every Qwirkle'},
  {id:'phase10', feat:true, name:'Phase 10', short:'10', color:'#007AFF', low:true, min:2, max:6, blurb:'Tracks phases, go-outs and penalty cards'},
  {id:'yahtzee', feat:true, name:'Yahtzee', short:'Y', color:'#AF52DE', low:false, min:1, max:8, blurb:'Full scorecard · tracks Yahtzees and bonuses'},
  {id:'uno', name:'Uno', short:'U', color:'#FF3B30', target:500, low:false, blurb:'First to 500 wins', how:'The round winner scores the cards left in everyone else’s hand. Others score 0.'},
  {id:'crokinole', name:'Crokinole', short:'Cr', color:'#A2845E', target:100, low:false, blurb:'First to 100 wins', how:'Points scored this round, including 20s.'},
  {id:'hearts', name:'Hearts', short:'H', color:'#FF2D55', target:100, low:true, blurb:'Ends at 100 · lowest wins', how:'Penalty points taken this hand. 26 per hand, or 26 to everyone else if someone shoots the moon.'},
  {id:'skyjo', name:'Skyjo', short:'Sk', color:'#34C759', target:100, low:true, blurb:'Ends at 100 · lowest wins', how:'Sum of each player’s cards. Double the score of whoever ended the round if they weren’t lowest.'},
  {id:'golf', name:'Golf', short:'G', color:'#00A5A8', target:null, rounds:9, low:true, blurb:'9 holes · lowest wins', how:'Card total for this hole.'},
  {id:'rummy', name:'Rummy', short:'R', color:'#5856D6', target:500, low:false, blurb:'First to 500 wins', how:'Points melded minus cards left in hand.'},
  {id:'cribbage', name:'Cribbage', short:'Cb', color:'#8E5B3A', target:121, low:false, blurb:'First to 121 wins', how:'Points pegged and counted this hand, including the crib.'},
  {id:'farkle', name:'Farkle', short:'Fk', color:'#E0533D', target:10000, low:false, blurb:'Dice \u00b7 first to 10,000', how:'Points banked this turn. A Farkle scores 0.'},
  {id:'mexicantrain', name:'Mexican Train', short:'MT', color:'#2E8B57', rounds:13, low:true, blurb:'Dominoes \u00b7 13 rounds \u00b7 lowest wins', how:'Pips left in hand. Whoever went out scores 0.'},
  {id:'scrabble', name:'Scrabble', short:'Sc', color:'#B5651D', low:false, blurb:'Word game \u00b7 highest total wins', how:'Points scored this turn, including bonuses.'}
];

let S = null;
const ui = {tab:'games', stack:[], statFilter:'all', setup:null, round:null, draft:null, dtab:null, box:null, pColor:null, pPhoto:null, editPid:null, confirm:null, libTab:'classics', libq:'', have:[], libSort:'popular', info:null, cr:null, sheetBack:null};
const KEY = 'tally.v1';
const DAY = 864e5;

/* ---------- small helpers ---------- */
const allTemplates = () => TEMPLATES.concat((S && S.customs) || []);
const tmpl = id => allTemplates().find(t => t.id === id) || {id, name:'Game', short:'?', color:'#8E8E93', blurb:''};
const player = id => S.players.find(p => p.id === id);
const pname = id => (TEAMS[id] && TEAMS[id].name) || player(id)?.name || 'Former player';
const pcolor = id => (TEAMS[id] && TEAMS[id].color) || player(id)?.color || '#8E8E93';
const initials = n => (String(n).trim().split(/\s+/).map(w => w[0]).join('').slice(0,2) || '?').toUpperCase();
const fmt = n => n < 0 ? '−' + Math.abs(n) : String(n);
const signed = n => n > 0 ? '+' + n : fmt(n);
const ordinal = n => n + (['th','st','nd','rd'][(n%100 > 10 && n%100 < 14) ? 0 : (n%10 < 4 ? n%10 : 0)] || 'th');
const num = v => { const n = parseInt(String(v ?? '').replace('−','-'), 10); return Number.isFinite(n) ? n : 0; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const avg = (a, f) => a.length ? a.reduce((s,x) => s + f(x), 0) / a.length : null;
const plural = (n, w) => `${n} ${n === 1 ? w : pluralWord(w)}`;
const listNames = ids => { const n = ids.map(pname); return n.length < 3 ? n.join(' and ') : n.slice(0,-1).join(', ') + ' and ' + n[n.length-1]; };
const anyOne = (g, D, k) => g.players.find(p => D[p] && D[p][k]);
// detailed rounds for one player (rounds entered in Totals-only mode are skipped)
const dr = (pid, games) => { const out = []; games.forEach(g => g.rounds.forEach((r,i) => { const d = r.detail && r.detail[pid]; if(d && !r.q) out.push({g, r, i, d, s:r.scores[pid]}); })); return out; };
const quickCompute = (g, D) => { const scores = {}; g.players.forEach(p => scores[p] = num(D[p].pts)); return {scores}; };

/* ======================================================================
   SCORING ENGINES — one per featured game
   fields(): what each player enters in Detailed mode
   compute(): turns entries into round scores + detail kept for stats
   stats(): game-specific numbers for a player
   ====================================================================== */
const WILDS = ['3s','4s','5s','6s','7s','8s','9s','10s','Jacks','Queens','Kings'];
const PHASES = ['2 sets of 3','1 set of 3 + 1 run of 4','1 set of 4 + 1 run of 4','1 run of 7','1 run of 8','1 run of 9','2 sets of 4','7 cards of one colour','1 set of 5 + 1 set of 2','1 set of 5 + 1 set of 3'];
const p10done = (g, pid) => g.rounds.filter(r => r.detail?.[pid]?.made).length;

/* Sushi Go menu cards */
const SUSHI = {

const SUSHI_GROUPS = [['roll','Rolls',1],['app','Appetizers',3],['special','Specials',2],['dessert','Dessert',1]];
const SUSHI_ORIGINAL = {roll:['maki'], app:['tempura','sashimi','dumpling'], special:['wasabi','chopsticks'], dessert:['pudding']};
const SUSHI_PARTY = {roll:['maki'], app:['tempura','sashimi','miso'], special:['wasabi','tea'], dessert:['greentea']};
const menuOf = g => g.menu || SUSHI_ORIGINAL;
const menuCards = m => [...m.roll, ...m.app, ...m.special, ...m.dessert];
const FRUIT = [-2, 0, 1, 3, 6, 10];
function tierAward(ps, val, rewards){
  const out = {}; ps.forEach(p => out[p] = 0);
  const vals = [...new Set(ps.map(val).filter(v => v > 0))].sort((a,b) => b - a); let pos = 0;
  for(const v of vals){ if(pos >= rewards.length) break; const grp = ps.filter(p => val(p) === v); const share = Math.floor(rewards[pos] / grp.length); grp.forEach(p => out[p] = share); pos += grp.length; }
  return out;
}
function mostFewest(ps, val, hi, lo, allowLo, split){
  const out = {}; ps.forEach(p => out[p] = 0);
  const vs = ps.map(val), mx = Math.max(...vs), mn = Math.min(...vs); if(mx === mn) return out;
  const top = ps.filter(p => val(p) === mx), bot = ps.filter(p => val(p) === mn);
  top.forEach(p => out[p] += split ? Math.floor(hi / top.length) : hi);
  if(allowLo) bot.forEach(p => out[p] -= split ? Math.floor(lo / bot.length) : lo);
  return out;
}

/* Yahtzee scorecard */
const YBOX = [
  {k:'ones', label:'Ones', up:1}, {k:'twos', label:'Twos', up:2}, {k:'threes', label:'Threes', up:3},
  {k:'fours', label:'Fours', up:4}, {k:'fives', label:'Fives', up:5}, {k:'sixes', label:'Sixes', up:6},
  {k:'tk', label:'3 of a kind', hint:'Three dice the same. Score the total of all five dice.'},
  {k:'fk', label:'4 of a kind', hint:'Four dice the same. Score the total of all five dice.'},
  {k:'fh', label:'Full house', fixed:25}, {k:'ss', label:'Small straight', fixed:30}, {k:'ls', label:'Large straight', fixed:40},
  {k:'yz', label:'Yahtzee', fixed:50}, {k:'ch', label:'Chance', hint:'Any dice. Score the total of all five.'}
];
function yCalc(g, pid){
  const c = (g.card && g.card[pid]) || {}; let up = 0, lo = 0, filled = 0, yb = 0, zeros = 0;
  YBOX.forEach(b => { const v = c[b.k]; if(v != null){ filled++; if(v === 0) zeros++; if(b.up) up += v; else lo += v; } if(c['b_' + b.k]) yb++; });
  const bonus = up >= 63 ? 35 : 0;
  return {up, lo, bonus, yb, filled, zeros, total:up + bonus + lo + yb * 100};
}

const eng = g => engOf(g.tid);
const isFeat = tid => !!ENGINES[tid];

/* ---------- game model ---------- */
// Games where a dealer deals each round; the deal passes to the left (the next player in seating order)
const DEALT = ['fivecrowns','wizard','sushi','phase10','uno','hearts','skyjo','golf','rummy','cribbage'];
const dealerAt = (g, i) => g.dealer == null ? null : g.players[((g.dealer + i) % g.players.length + g.players.length) % g.players.length];
function dealNote(g, i){
  const n = g.players.length, d = g.players.indexOf(dealerAt(g, i));
  if(g.tid === 'wizard') return `${pname(g.players[(d + 1) % n])} bids first`;
  if(g.tid === 'hearts') return ['Pass 3 cards left','Pass 3 cards right','Pass 3 cards across','No passing'][i % 4];
  if(g.tid === 'sushi') return `${n <= 2 ? 10 : n <= 3 ? (g.menu ? 10 : 9) : n <= 4 ? (g.menu ? 9 : 8) : n <= 5 ? (g.menu ? 9 : 7) : n <= 7 ? 8 : 7} cards each`;
  if(g.tid === 'phase10') return '10 cards each';
  if(g.tid === 'uno') return '7 cards each';
  if(g.tid === 'golf') return '6 cards each';
  if(g.tid === 'skyjo') return '12 cards each';
  return '';
}
function newGame(tid, pids, o = {}){
  const t = tmpl(tid), E = ENGINES[tid] || {};
  const g = {id:uid(), tid, players:pids.slice(), rounds:[], status:'active', started:Date.now(),
    target: o.target !== undefined ? o.target : (t.target ?? null), low: o.low !== undefined ? o.low : !!t.low,
    maxRounds: tid === 'wizard' ? Math.floor(60 / pids.length) : (t.rounds || null), quick: !!o.quick};
  if(tid === 'sushi' && o.menu) g.menu = JSON.parse(JSON.stringify(o.menu));
  if(t.kind === 'lives') g.lives = t.lives || 3;
  if(o.teams && o.teams.filter(m => m.length).length >= 2) makeTeams(g, o.teams);
  else if(o.dealer != null && o.dealer >= 0 && pids.length > 1) g.dealer = o.dealer % pids.length;
  if(E.card && !g.quick){ g.card = {}; pids.forEach(p => g.card[p] = {}); }
  return g;
}
function totals(g){
  const t = {}; g.players.forEach(p => t[p] = 0);
  if(g.card) g.players.forEach(p => t[p] = yCalc(g, p).total);
  g.rounds.forEach(r => g.players.forEach(p => t[p] += (r.scores[p] || 0)));
  return t;
}
function standings(g){
  const E = eng(g), tot = totals(g);
  const arr = g.players.map(pid => ({pid, total:tot[pid]}));
  const cmp = E.cmp ? (a,b) => E.cmp(g, a, b) : (a,b) => g.low ? a.total - b.total : b.total - a.total;
  arr.sort(cmp);
  arr.forEach((r,i) => r.place = i && cmp(arr[i-1], r) === 0 ? arr[i-1].place : i + 1);
  return arr;
}
function endInfo(g){
  const E = eng(g);
  if(E.end){ const e = E.end(g); if(e) return e; if(g.card) return null; }
  if(!g.rounds.length) return null;
  if(g.maxRounds && g.rounds.length >= g.maxRounds) return {msg:`All ${plural(g.maxRounds, (E.unit || 'round').toLowerCase())} are done.`};
  if(g.target != null){
    const tot = totals(g); const hit = g.players.filter(p => tot[p] >= g.target).sort((a,b) => tot[b] - tot[a]);
    if(hit.length) return {msg:`${pname(hit[0])} reached ${fmt(tot[hit[0]])}.`};
  }
  return null;
}
const turnsOf = g => g.card ? Math.max(0, ...g.players.map(p => yCalc(g, p).filled)) : g.rounds.length;
const hasPlay = g => g.card ? g.players.some(p => yCalc(g, p).filled) : g.rounds.length > 0;
const doneGames = f => S.games.filter(g => g.status === 'done' && (f === 'all' || g.tid === f)).sort((a,b) => b.ended - a.ended);
// Play time: from Start to Finish, but any gap longer than 20 minutes between scores
// (a game left open overnight, a dinner break) only counts as 20 minutes.
const GAP = 20 * 6e4;
function mins(g){
  const end = g.ended || Date.now();
  if(!g.acts || !g.acts.length) return Math.max(1, Math.round((end - g.started) / 6e4));
  const t = [g.started, ...g.acts.filter(x => x > g.started && x < end), end].sort((a, b) => a - b);
  let ms = 0; for(let i = 1; i < t.length; i++) ms += Math.min(GAP, t[i] - t[i - 1]);
  return Math.max(1, Math.round(ms / 6e4));
}
const touch = g => { (g.acts = g.acts || []).push(Date.now()); if(g.acts.length > 400) g.acts.splice(0, g.acts.length - 400); };
const dur = m => m < 60 ? `${m} min` : `${Math.floor(m/60)} h ${m%60 ? (m%60) + ' min' : ''}`.trim();
function rel(ts){
  const d = new Date(ts), n = new Date();
  const a = new Date(n.getFullYear(), n.getMonth(), n.getDate()), b = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diff = Math.round((a - b) / DAY);
  if(diff === 0) return 'Today'; if(diff === 1) return 'Yesterday';
  if(diff < 7) return d.toLocaleDateString(undefined, {weekday:'long'});
  return d.toLocaleDateString(undefined, {month:'short', day:'numeric'});
}
function fmtStat(s){
  if(s.v == null) return '—';
  if(typeof s.v === 'string') return esc(s.v);
  if(s.f === '%') return Math.round(s.v * 100) + '%';
  if(s.f === 1) return fmt(+s.v.toFixed(1));
  return fmt(Math.round(s.v));
}

/* ---------- storage + sample data ---------- */
function save(){ RV++; indexTeams(); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw){ S = JSON.parse(raw); if(S && S.players){ migrate(); indexTeams(); return; } } }catch(e){}
  S = seed(); save();
}
const SKILL = {p0:1.12, p1:1.18, p2:0.92, p3:1.0, p4:1.05};
const playedClassics = () => [...new Set(S.games.filter(g => !isFeat(g.tid)).map(g => g.tid))];
function migrate(){
  if(!S.v || S.v < 2){
    S.customs = S.customs || [];
    S.games.forEach(g => { if(g.tid === 'yahtzee' && !g.card) g.quick = true; });
    if(S.sample){ // rebuild the sample games with detailed scoring; keep players and anything that involves your own players
      const sp = S.players.filter(p => SKILL[p.id]).map(p => ({...p, k:SKILL[p.id]}));
      S.games = S.games.filter(g => g.players.some(p => !SKILL[p])).concat(sp.length >= 4 ? seedGames(sp) : []);
    }
    S.v = 2;
  }
  if(S.v < 3){ S.customs = S.customs || []; S.added = [...new Set([...playedClassics(), ...S.customs.map(t => t.id)])]; S.v = 3; }
  S.added = S.added || [];
  S.settings = {...DEFAULT_SETTINGS, ...(S.settings || {})};
  save();
}
function seed(){
  const now = Date.now();
  const roster = [['Harper',0],['Maya',4],['Liam',1],['Noah',2],['Ava',3]];
  const players = roster.map(([n,c],i) => ({id:'p'+i, name:n, color:COLORS[c], created:now - 62*DAY}));
  S = {players, games:[], customs:[], added:[], sample:true, v:3, settings:(S && S.settings) || {...DEFAULT_SETTINGS}};
  S.games = seedGames(players.map(p => ({...p, k:SKILL[p.id]})));
  S.added = playedClassics();
  return S;
}
function seedGames(players){
  let x = 20261026;
  const rnd = () => (x = (x * 1103515245 + 12345) % 2147483648) / 2147483648;
  const ri = (a,b) => Math.floor(a + rnd() * (b - a + 1));
  const pick = (arr, w) => { const ws = arr.map(w), sum = ws.reduce((a,b) => a+b, 0); let r = rnd()*sum; for(let i=0;i<arr.length;i++){ r -= ws[i]; if(r <= 0) return arr[i]; } return arr[arr.length-1]; };
  const R = {rnd, ri, pick};
  const now = Date.now();
  function plain(tid, ps){ const s = {};
    if(tid === 'uno'){ ps.forEach(p => s[p.id] = 0); s[pick(ps, p => p.k ** 4).id] = ri(30,170); }
    else if(tid === 'crokinole') ps.forEach(p => s[p.id] = Math.round(ri(0,7) * p.k) * 5);
    else if(tid === 'hearts'){ ps.forEach(p => s[p.id] = 0); for(let i=0;i<13;i++) s[pick(ps, p => 1/p.k**3).id] += 1; s[pick(ps, p => 1/p.k**4).id] += 13; }
    else if(tid === 'skyjo') ps.forEach(p => s[p.id] = Math.round(ri(-2,34) / p.k));
    return s; }
  function ycard(k){ const c = {}; YBOX.slice(0,6).forEach(b => c[b.k] = b.up * clamp(Math.round(ri(1,4) * k - (rnd() < .1 ? 2 : 0)), 0, 5));
    c.tk = rnd() < .12 ? 0 : ri(13, 26); c.fk = rnd() < .4 ? 0 : ri(12, 27); c.fh = rnd() < .7 * k ? 25 : 0; c.ss = rnd() < .75 ? 30 : 0;
    c.ls = rnd() < .42 * k ? 40 : 0; c.yz = rnd() < .28 * k ? 50 : 0; c.ch = ri(17, 27); if(c.yz === 50 && rnd() < .3) c.b_ch = true; return c; }
  const plan = [['blitz',60],['wizard',57],['fivecrowns',54],['sushi',51],['qwirkle',48],['phase10',45],['yahtzee',43],['blitz',40],['uno',38],['wizard',35],
    ['sushi',32,'party'],['fivecrowns',29],['crokinole',27],['blitz',24],['yahtzee',22],['hearts',20],['qwirkle',17],['wizard',15],['phase10',12],['blitz',10],
    ['sushi',8],['fivecrowns',6],['yahtzee',5],['skyjo',4],['blitz',3],['qwirkle',2],['wizard',1]];
  const games = [];
  const build = (tid, ps, o) => {
    const t = tmpl(tid), E = ENGINES[tid];
    const g = newGame(tid, ps.map(p => p.id), {...o, dealer:DEALT.includes(tid) ? 0 : null});
    if(E && E.card) ps.forEach(p => g.card[p.id] = ycard(p.k));
    else if(E && E.sim){ g._end = ri(15, 21);
      for(let i = 0; i < 60; i++){ const D = E.sim.call(E, g, ps, i, R); const res = E.compute.call(E, g, D, i, 'detail'); g.rounds.push({scores:res.scores, detail:res.detail, raw:D}); if(endInfo(g)) break; }
      delete g._end; }
    else for(let i = 0; i < 40; i++){ g.rounds.push({scores:plain(tid, ps)}); if(endInfo(g)) break; }
    return g;
  };
  for(const [tid, ago, opt] of plan){
    const t = tmpl(tid);
    const pool = players.slice().sort(() => rnd() - .5);
    const n = tid === 'crokinole' ? (rnd() < .5 ? 2 : 4) : clamp(ri(3, 5), Math.max(t.min || 2, 3), Math.min(t.max || 5, 5));
    const g = build(tid, pool.slice(0, n), opt === 'party' ? {menu:SUSHI_PARTY} : {});
    g.status = 'done'; g.started = now - ago*DAY - ri(1,6)*36e5; g.ended = g.started + Math.max(turnsOf(g), 4) * ri(2,5) * 6e4 + ri(3,9)*6e4;
    games.push(g);
  }
  // one game in progress
  const live = [players[0], players[1], players[2], players[4]];
  const g = newGame('blitz', live.map(p => p.id)); g.started = now - 24*6e4;
  for(let i = 0; i < 4; i++){ const D = ENGINES.blitz.sim(g, live, i, R); const res = ENGINES.blitz.compute(g, D, i, 'detail'); g.rounds.push({scores:res.scores, detail:res.detail, raw:D}); }
  games.push(g);
  return games;
}

/* ---------- player stats ---------- */
function playerStats(pid, f='all'){
  const gs = doneGames(f).filter(g => inGame(g, pid));
  let wins = 0, placeSum = 0, best = null; const byT = {}; const results = [];
  gs.forEach(g => {
    const sd = sideOf(g, pid), st = standings(g), me = st.find(r => r.pid === sd); const won = me.place === 1;
    if(won) wins++; placeSum += me.place;
    const b = byT[g.tid] || (byT[g.tid] = {played:0, wins:0}); b.played++; if(won) b.wins++;
    results.push({g, place:me.place, n:st.length, total:me.total, won});
    if(!g.low) g.rounds.forEach(r => { const v = r.scores[sd]; if(v != null && (!best || v > best.v)) best = {v, g}; });
  });
  let cur = 0; for(const r of results){ if(r.won) cur++; else break; }
  let bestStreak = 0, run = 0; results.slice().reverse().forEach(r => { run = r.won ? run + 1 : 0; bestStreak = Math.max(bestStreak, run); });
  return {played:gs.length, wins, pct:gs.length ? wins / gs.length : 0, avgPlace:gs.length ? placeSum / gs.length : 0, best, cur, bestStreak, byT, results, games:gs};
}
/* ---------- skill rating ----------
   Everyone starts at 1000. After each finished game, every pair of players is treated as a
   head-to-head match: finishing ahead of someone is a win, behind is a loss, level is a draw.
   Beating a higher-rated player earns more than beating a lower-rated one (Elo-style).
   New players move faster for their first 5 games. */
const RATE0 = 1000, PROV = 5;
let RV = 0; const RC = {};
function ratings(f = 'all'){
  const key = f + '|' + RV; if(RC[f] && RC[f].key === key) return RC[f];
  const R = {}, G = {}, hist = {}, byGame = {};
  S.games.filter(g => g.status === 'done' && (f === 'all' || g.tid === f)).sort((a, b) => a.ended - b.ended).forEach(g => {
    // In team games every member takes the team's finish; teammates aren't compared with each other
    const st = expandSides(g, standings(g)).filter(r => player(r.pid)); if(new Set(st.map(r => r.side)).size < 2) return;
    const d = {};
    st.forEach(a => {
      const ra = R[a.pid] ?? RATE0; let sum = 0, opp = 0;
      st.forEach(b => { if(a === b || a.side === b.side) return; opp++; const rb = R[b.pid] ?? RATE0, exp = 1 / (1 + Math.pow(10, (rb - ra) / 400)); sum += (a.place < b.place ? 1 : a.place > b.place ? 0 : .5) - exp; });
      d[a.pid] = opp ? ((G[a.pid] || 0) < PROV ? 48 : 32) * sum / opp : 0;
    });
    st.forEach(a => { R[a.pid] = (R[a.pid] ?? RATE0) + d[a.pid]; G[a.pid] = (G[a.pid] || 0) + 1; (hist[a.pid] = hist[a.pid] || []).push({g, r:R[a.pid], d:d[a.pid]}); });
    byGame[g.id] = d;
  });
  const out = {key, r:R, games:G, hist, byGame};
  out.rank = Object.keys(R).sort((a, b) => R[b] - R[a]);
  RC[f] = out; return out;
}

  const W = 320, H = 110, L = 40, Rr = 10, T = 12, B = 12;

  const line = vals.map((v, i) => `${xs(i).toFixed(1)},${ys(v).toFixed(1)}`).join(' ');
  const base = vals.includes(RATE0) || (RATE0 > lo && RATE0 < hi) ? `<line class="grid" x1="${L}" x2="${W - Rr}" y1="${ys(RATE0).toFixed(1)}" y2="${ys(RATE0).toFixed(1)}" stroke-dasharray="3 4"/>` : '';

function rivals(pid){
  const gs = doneGames('all').filter(g => inGame(g, pid)); const out = {};
  gs.forEach(g => { const st = expandSides(g, standings(g)), me = st.find(r => r.pid === pid);
    st.forEach(o => { if(o.pid === pid || o.side === me.side || !player(o.pid)) return; const r = out[o.pid] || (out[o.pid] = {pid:o.pid, n:0, ahead:0, behind:0});
      r.n++; if(me.place < o.place) r.ahead++; else if(me.place > o.place) r.behind++; }); });

function records(f, gs, lb){
  const rec = (label, val, sub, a) => `<${a ? 'button' : 'div'} class="row" ${a ? `data-a="${a}"` : ''}><div class="grow"><div class="t1">${label}</div></div><div class="rec"><b>${val}</b><div>${sub}</div></div>${a ? ICON.chev : ''}</${a ? 'button' : 'div'}>`;
  const out = [];
  const streak = lb.slice().sort((a,b) => b.s.bestStreak - a.s.bestStreak)[0];
  if(f === 'all'){
    // Only records that mean the same thing in every game
    const most = lb[0], q = lb.filter(x => x.s.played >= 5).sort((a,b) => b.s.pct - a.s.pct)[0];
    const played = lb.slice().sort((a,b) => b.s.played - a.s.played)[0];
    const fav = {}; gs.forEach(g => fav[g.tid] = (fav[g.tid] || 0) + 1);
    const top = Object.entries(fav).sort((a,b) => b[1] - a[1])[0];
    if(most && most.s.wins) out.push(rec('Most wins', most.s.wins, esc(most.p.name), `push:player:${most.p.id}`));
    if(q) out.push(rec('Best win rate', Math.round(q.s.pct * 100) + '%', `${esc(q.p.name)} \u00b7 ${q.s.played} games`, `push:player:${q.p.id}`));
    if(streak && streak.s.bestStreak) out.push(rec('Longest win streak', streak.s.bestStreak, esc(streak.p.name), `push:player:${streak.p.id}`));
    if(played) out.push(rec('Most games played', played.s.played, esc(played.p.name), `push:player:${played.p.id}`));
    if(top) out.push(rec('Most played game', esc(tmpl(top[0]).name), plural(top[1], 'game'), `filter:${top[0]}`));
  } else {
    const t = tmpl(f), E = engOf(f), unit = (E.unit || 'Round').toLowerCase(), lowG = gs[0] && gs[0].low, phase = f === 'phase10' || ['wins','order','lives'].includes(E.kind);
    let bestR = null, bestG = null, margin = null, close = null, fast = null;
    gs.forEach(g => {
      if(!phase) g.rounds.forEach(r => g.players.forEach(p => { if(r.scores[p] == null) return; const v = r.scores[p]; if(!bestR || v > bestR.v) bestR = {v, p, g}; }));
      const st = standings(g);
      if(!phase) st.forEach(r => { if(!bestG || (g.low ? r.total < bestG.v : r.total > bestG.v)) bestG = {v:r.total, p:r.pid, g}; });
      if(st.length > 1 && !phase){ const m = Math.abs(st[0].total - st[1].total);
        if(!margin || m > margin.v) margin = {v:m, p:st[0].pid, g}; if(m > 0 && (!close || m < close.v)) close = {v:m, p:st[0].pid, g}; }
      if(f === 'phase10' && (!fast || g.rounds.length < fast.v)) fast = {v:g.rounds.length, p:st[0].pid, g};
    });
    if(bestR) out.push(rec(lowG ? `Worst ${unit}` : `Highest ${unit}`, fmt(bestR.v), `${esc(pname(bestR.p))} \u00b7 ${rel(bestR.g.ended)}`, `push:game:${bestR.g.id}`));
    if(bestG) out.push(rec(lowG ? 'Lowest final score' : 'Highest final score', fmt(bestG.v), `${esc(pname(bestG.p))} \u00b7 ${rel(bestG.g.ended)}`, `push:game:${bestG.g.id}`));
    if(fast) out.push(rec('Fastest to Phase 10', plural(fast.v, 'hand'), `${esc(pname(fast.p))} \u00b7 ${rel(fast.g.ended)}`, `push:game:${fast.g.id}`));
    if(margin) out.push(rec('Biggest win', `by ${margin.v}`, `${esc(pname(margin.p))} \u00b7 ${rel(margin.g.ended)}`, `push:game:${margin.g.id}`));
    if(close) out.push(rec('Closest finish', `by ${close.v}`, `${esc(pname(close.p))} \u00b7 ${rel(close.g.ended)}`, `push:game:${close.g.id}`));
    if(streak && streak.s.bestStreak > 1) out.push(rec('Longest win streak', streak.s.bestStreak, esc(streak.p.name), `push:pgame:${streak.p.id}:${f}`));
  }
  return out.length ? `<h2 class="sh">Records</h2><div class="group plain">${out.join('')}</div>` : '';
}

function startGame(fromGame){

    const keep = fromGame.players.filter(p => player(p)), nextD = fromGame.dealer != null ? dealerAt(fromGame, fromGame.rounds.length) : null;
    const tg = fromGame.teams ? Object.values(fromGame.teams).map(tm => tm.members.filter(p => player(p))) : null;
    g = newGame(fromGame.tid, tg ? tg.flat() : keep, {target:fromGame.target, low:fromGame.low, quick:fromGame.quick, menu:fromGame.menu, dealer:fromGame.dealer != null ? Math.max(0, keep.indexOf(nextD)) : null, teams:tg});
  } else {
    const u = ui.setup; let tid = u.tid; const tv = String(u.target ?? '').trim(); const target = tv === '' ? null : num(tv);
    if(tid === 'new'){
      const name = u.name.trim();
      const c = {id:'c_' + uid(), name, short:initials(name), color:COLORS[(S.customs.length + 3) % COLORS.length], target, low:u.low,
        blurb:target != null ? (u.low ? `Ends at ${target} · lowest wins` : `First to ${target} wins`) : (u.low ? 'Lowest total wins' : 'Highest total wins'), how:'Points scored this round.'};
      S.customs.push(c); tid = c.id;
    }
    const t = tmpl(tid);
    g = newGame(tid, u.picks, {target: (t.target != null || tid.startsWith('c_')) ? target : null, low:u.low, quick:isFeat(tid) && u.quick, menu: tid === 'sushi' && u.version === 'party' ? u.menu : null, dealer:u.deal && tid !== 'yahtzee' && !t.teams ? Math.max(0, u.picks.indexOf(u.first || u.picks[0])) : null,
      teams:t.teams ? Array.from({length:u.teamN || 2}, (_, i) => u.picks.filter(p => u.team[p] === i)) : null});
    closeSheet();

  S.games.push(g); save();
  ui.tab = 'games'; ui.stack = [{type:'play', id:g.id}]; go();
}

/* rounds: one generic sheet driven by each game's fields.

const realG = () => S.games.find(x => x.id === ui.round.gid);

const RG = () => { const g = realG(); return ui.round.idx == null ? g : Object.assign({}, g, {rounds:g.rounds.slice(0, ui.round.idx)}); };
const roundMode = g => (ui.round && ui.round.mode) || ((eng(g).fields && !g.quick) ? 'detail' : 'quick');

}

function fieldHtml(f, pid){

// Rebuild what was typed for a saved round, so it can be edited
function draftFrom(g, r){

    if(r.raw && r.raw[p]){ D[p] = JSON.parse(JSON.stringify(r.raw[p])); return; }
    const d = (r.detail && r.detail[p]) || {}, s = r.scores[p] ?? 0;
    if(g.tid === 'sushi' && !r.q && d.counts) D[p] = {...d.counts};
    else if(g.tid === 'qwirkle' && !r.q && r.detail) D[p] = {...d};
    else D[p] = {...d, pts:String(g.tid === 'qwirkle' && d.out ? s - 6 : s)};

function openRound(gid, idx){

  ui.round = {gid, idx:editing ? idx : null, mode};
  if(editing) ui.draft = draftFrom(g, r); else { ui.draft = {}; g.players.forEach(p => ui.draft[p] = {}); }
  ui.dtab = g.players[0];

}
function roundHtml(){
  const g = RG(), E = eng(g), i = g.rounds.length, mode = roundMode(g), t = tmpl(g.tid), editing = ui.round.idx != null;

function syncRound(){
  const g = RG(), mode = roundMode(g), d = ui.draft;

function fixField(g, pid, k){ const E = eng(g); if(E.fix) E.fix(ui.draft[pid], k); if(E.after && roundMode(g) === 'detail') E.after(g, ui.draft); }

function rescoreFrom(g, start){

function updatePreview(){

// Crop to a centred square and shrink to 320px so photos stay small on the phone
function loadPhoto(file){
  if(!file || !file.type.startsWith('image/')) return toast('That file isn’t a photo');
  const url = URL.createObjectURL(file); const img = new Image();
  img.onload = () => {
    const side = Math.min(img.naturalWidth, img.naturalHeight), size = Math.min(320, side);
    const c = document.createElement('canvas'); c.width = c.height = size;
    c.getContext('2d').drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, size, size);
    URL.revokeObjectURL(url); ui.pPhoto = c.toDataURL('image/jpeg', .82); updatePreview();
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('Couldn’t open that photo. Try another one.'); };
  img.src = url;
}
function savePlayer(){
  const name = ($('#pName').value || '').trim(); if(!name) return;
  if(S.players.some(p => p.name.toLowerCase() === name.toLowerCase() && p.id !== ui.editPid)) return toast(`${name} is already a player`);
  if(ui.editPid){ const p = player(ui.editPid); p.name = name; p.color = ui.pColor; p.photo = ui.pPhoto || undefined; toast('Saved'); }
  else { S.players.push({id:uid(), name, color:ui.pColor, photo:ui.pPhoto || undefined, created:Date.now()}); toast(`${name} added`); }
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ if(ui.pPhoto) toast('Storage is full. The photo may not be kept.'); }
  closeSheet(); render();
}

}

document.addEventListener('input', e => {
  const t = e.target, id = t.id;
  if(ui.si && ['siName','siEmail','siCode'].includes(t.id)){
    if(t.id === 'siCode') t.value = t.value.replace(/\D/g, '').slice(0, 6);
    const k = {siName:'name', siEmail:'email', siCode:'code'}[t.id]; ui.si[k] = t.value;
    const ok = k === 'name' ? !!t.value.trim() : k === 'email' ? /^\S+@\S+\.\S+$/.test(t.value.trim()) : /^\d{6}$/.test(t.value);
    const b = $('#siGo'); if(b) b.disabled = !ok; return; }
  if(t.id === 'libq'){ ui.libq = t.value; refreshLib(); return; }
  if(t.id === 'rq'){ filterRules(t.value); return; }
  if(ui.cr){
    const map = {crName:'name', crVal:'val', crWinN:'winN', crOrdN:'orderN', crPts:'placePts', crBidN:'bidN', crBidBase:'bidBase', crBidPer:'bidPer', crBidPen:'bidPen', crExtra:'extraDraft'};
    if(map[id]){ ui.cr[map[id]] = t.value; return; }
    if(t.dataset.ik != null){ ui.cr.items[Number(t.dataset.ik)].name = t.value; return; }
    if(t.dataset.wk){ ui.cr.words[t.dataset.wk] = t.value; return; }
    if(t.dataset.rk){ ui.cr.rules[t.dataset.rk] = t.value; return; }
  }
  if(t.dataset.k && ui.round){ const g = RG(); const f = fieldsFor(g, t.dataset.p, roundMode(g)).find(x => x.k === t.dataset.k);
    ui.draft[t.dataset.p][t.dataset.k] = f.type === 'num' ? t.value.replace('−','-') : (t.value === '' ? 0 : clamp(num(t.value), f.min ?? 0, f.max ?? 99));
    fixField(g, t.dataset.p, t.dataset.k); syncRound(); return; }
  if(id === 'boxv'){ ui.box.v = t.value === '' ? null : clamp(num(t.value), 0, 30); $('#sheetAction').disabled = ui.box.v == null; return; }
  if(id === 'setName'){ ui.setup.name = t.value; const btn = $('#sheetAction'); const [mn, mx] = setupRange(); btn.disabled = !(ui.setup.picks.length >= mn && ui.setup.picks.length <= mx && t.value.trim()); }
  else if(id === 'setTarget') ui.setup.target = t.value;
  else if(id === 'pName') updatePreview();
});

document.addEventListener('focusin', e => { if(e.target.matches && e.target.matches('#sheet input[inputmode=numeric]')) setTimeout(() => e.target.select?.(), 0); });
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && !$('#replay').hidden) return closeReplay(true);
  if(e.key === 'Escape' && !$('#sheetWrap').hidden) return closeSheet();
  if(e.key !== 'Enter') return;
  const t = e.target;
  if(t.dataset && t.dataset.k){ e.preventDefault(); const all = [...document.querySelectorAll('#sheet input[data-k]')]; const i = all.indexOf(t); i < all.length - 1 ? all[i+1].focus() : saveRound(); }
  else if(t.id === 'boxv'){ e.preventDefault(); saveBox(); }
  else if(t.id === 'libq' || t.id === 'rq'){ e.preventDefault(); t.blur(); }
  else if(t.id === 'crExtra'){ e.preventDefault(); document.querySelector('[data-a="crxadd"]').click(); }
  else if(['siName','siEmail','siCode'].includes(t.id)){ e.preventDefault(); const b = $('#siGo'); if(b && !b.disabled) siNext(); }
  else if(t.id === 'pName'){ e.preventDefault(); savePlayer(); }
  else if(t.id === 'quickName'){ e.preventDefault(); document.querySelector('[data-a="quickAdd"]').click(); }
});

/* ======================================================================
   RULES — written in our own words from each publisher's rulebook.
   Each game: src (official source), facts, sections, disputes.
   ====================================================================== */
const RULES = {
  blitz:{
    src:[['Dutch Blitz FAQ (publisher)','https://dutchblitz.com/pages/policies-faq']],
    srcNote:'Dutch Blitz doesn’t publish its rulebook online. This summary follows the rule sheet in the box and the publisher’s FAQ.',
    facts:[['Players','2–4 (8 with expansions)'],['Win','First to 75'],['Turns','Everyone at once']],
    sections:[
      ['Goal',['Be the first player to reach 75 points over several hands. You score by getting cards into the shared piles in the middle while racing to empty your Blitz pile.']],
      ['Setup',['Each player takes one deck (the cards with the same picture on the back) and shuffles it.','Count 10 cards into a face-up stack. This is your Blitz pile; only the top card shows.','Deal the next 3 cards face up in a row beside it. These are your Post piles.','Hold the rest of your deck face down in one hand. This is your Wood pile.']],
      ['Playing',['Someone says “Go” and everyone plays at the same time. There are no turns.','Dutch piles (middle of the table): only a 1 can start a new pile. Build each pile upward, 1 to 10, all in one colour. Anyone can play on any Dutch pile.','Post piles (in front of you): build each one downward, alternating boy and girl pictures. Colour doesn’t matter here.','Your Blitz card can go onto a Dutch pile or onto one of your Post piles. When a Post pile is empty, fill the space with a card from your Blitz pile.','Wood pile: flip three cards at a time face up. Only the top face-up card can be played. When you run out, turn the stack over and keep going.','When a Dutch pile reaches 10, it’s complete. Set it aside face down.']],
      ['Ending a hand',['The hand ends the moment one player plays the last card of their Blitz pile and calls “Blitz!” Everyone stops right away.']],
      ['Scoring',['Sort the cards in the middle by their backs and give each player their own cards.','Each of your cards in the middle is worth +1.','Each card still in your Blitz pile is worth −2.','Cards in your Post piles and Wood pile don’t count.','Scores can go below zero.']],
      ['Winning',['Play hands until someone reaches 75 or more. If more than one player passes 75 in the same hand, the highest score wins.']]

function winText(t){
  const E = customEngine(t), U = E.unit.toLowerCase(), Us = pluralWord(U), pw = E.ptsWord.toLowerCase();
  switch(t.kind){
    case 'wins': return t.target ? `First to ${plural(t.target, U + ' win').replace(U + ' wins', U + ' wins')}` : `Most ${U} wins after ${t.rounds} ${Us}`;
    case 'order': return (t.rounds || 1) > 1 ? `Most ${pw} after ${t.rounds} ${Us}` : 'Finish first';
    case 'lives': return 'Last one standing';
    case 'bid': return `Highest score after ${t.rounds} ${Us}`;
    default: return t.target != null ? (t.low ? `Lowest score when someone reaches ${t.target}` : `First to ${t.target} ${pw}`) : t.rounds ? `${t.low ? 'Lowest' : 'Highest'} score after ${t.rounds} ${Us}` : `${t.low ? 'Lowest' : 'Highest'} score`;
  }
}

/* ======================================================================
   CUSTOM GAME ENGINES — six ways to keep score
   ====================================================================== */
const KINDS = [
  ['points', 'Points', 'Add up points every round', 'star'],
  ['sheet', 'Score sheet', 'List what scores, Tally does the math', 'cards'],
  ['wins', 'Round wins', 'Win rounds, no points needed', 'trophy'],
  ['order', 'Finishing order', 'Who came 1st, 2nd, 3rd…', 'flag'],
  ['lives', 'Lives', 'Lose lives until one is left', 'heart'],
  ['bid', 'Bid & make', 'Predict your tricks, then score', 'target']
];
const KIND = Object.fromEntries(KINDS.map(k => [k[0], {name:k[1], desc:k[2], sym:k[3]}]));
function pluralWord(w){
  w = String(w || '');
  if(/[^aeiou]y$/i.test(w)) return w.slice(0, -1) + 'ies';
  if(/(s|x|z|ch|sh)$/i.test(w)) return w + 'es';
  return w + 's';
}
function engOf(tid){ return ENGINES[tid] || customEngine(tmpl(tid)); }
const sgnv = v => v > 0 ? '+' + v : v < 0 ? '−' + Math.abs(v) : '0';
// Detailed rounds for a player in custom games (team-aware)
const drC = (pid, gs) => { const out = []; gs.forEach(g => { const sd = sideOf(g, pid); g.rounds.forEach((r, i) => { const d = r.detail && r.detail[sd]; if(d) out.push({g, r, i, d, s:r.scores[sd]}); }); }); return out; };
