function outAt(g, p){ const N = g.lives || 3; let lost = 0; for(let i = 0; i < g.rounds.length; i++){ lost += g.rounds[i].scores[p] || 0; if(lost >= N) return i + 1; } return Infinity; }

function customEngine(t){
  t = t || {}; const words = t.words || {}, unit = (words.round || 'Round').trim() || 'Round', U = unit.toLowerCase();
  const base = {custom:true, kind:t.kind || 'points', unit, units:pluralWord(unit), ptsWord:(words.pts || 'Points').trim() || 'Points', timer:t.timer || 0};
  const k = base.kind;
  if(k === 'sheet'){
    const items = (t.items || []).filter(it => it && it.name);
    return {...base, noQuick:true,
      fields:() => items.map(it => it.type === 'count' ? {k:it.id, type:'step', min:0, max:99, label:`${it.name} (${sgnv(it.val)} each)`}
        : it.type === 'pts' ? {k:it.id, type:'num', label:it.name} : {k:it.id, type:'tog', one:it.type === 'one', label:`${it.name} (${sgnv(it.val)})`}),
      compute(g, D){
        const scores = {}, detail = {};
        g.players.forEach(p => { let s = 0; const v = {};
          items.forEach(it => { const raw = D[p][it.id];
            if(it.type === 'count'){ const n = num(raw); v[it.id] = n; s += n * it.val; }
            else if(it.type === 'pts'){ const n = num(raw); v[it.id] = n; s += n; }
            else { v[it.id] = !!raw; if(raw) s += it.val; } });
          scores[p] = s; detail[p] = {v}; });
        return {scores, detail};
      },
      stats(pid, gs){
        const R = drC(pid, gs); if(!R.length) return null;
        const out = [{label:`Avg per ${U}`, v:avg(R, x => x.s), f:1, best:t.low ? 'low' : 'high'}];
        items.slice(0, 5).forEach(it => {
          if(it.type === 'count' || it.type === 'pts') out.push({label:`${it.name}`, v:R.reduce((a, x) => a + num(x.d.v && x.d.v[it.id]), 0), best:(it.type === 'pts' || it.val > 0) !== !!t.low ? 'high' : 'low', sub:'total'});
          else { const n = R.filter(x => x.d.v && x.d.v[it.id]).length; out.push({label:it.name, v:n, best:(it.val > 0) !== !!t.low ? 'high' : 'low', sub:`${Math.round(n / R.length * 100)}% of ${pluralWord(U)}`}); }
        });
        return out;
      },
      score:items.map(it => [it.name, it.type === 'count' ? `${sgnv(it.val)} each` : it.type === 'pts' ? 'Points entered' : sgnv(it.val) + (it.type === 'one' ? ' (one player)' : '')]),
      tally:[`After each ${U}, enter each player’s ${items.map(it => it.name.toLowerCase()).slice(0, 3).join(', ')}${items.length > 3 ? ' and more' : ''}. Tally works out the score.`, 'Every line on the score sheet is tracked as a stat on each player’s profile.']};
  }
  if(k === 'wins'){
    return {...base, noQuick:true, entry:'tap', low:false,
      fields:() => [{k:'won', type:'tog', one:!t.multi, label:'Won'}],
      tapMark:(d) => d && d.won ? '✓' : '',
      tap(g, D, p){ const on = !D[p].won; if(!t.multi) g.players.forEach(q => D[q].won = false); D[p].won = on; },
      compute(g, D){ const scores = {}, detail = {}; g.players.forEach(p => { scores[p] = D[p].won ? 1 : 0; detail[p] = {won:!!D[p].won}; });
        const w = g.players.filter(p => D[p].won); return {scores, detail, err:w.length ? null : `Tap who won this ${U}.`, summary:w.length ? `<b>${esc(listNames(w))}</b> won this ${U}.` : ''}; },
      disp:v => v ? '✓' : '·',
      sub:(g, pid, total) => `${plural(total, U + ' win').replace(/^(\d+) /, '$1 ')}${g.target ? ` · first to ${g.target}` : ''}`,
      end(g){ if(g.target){ const tot = totals(g), w = g.players.filter(p => tot[p] >= g.target); if(w.length) return {msg:`${pname(w[0])} won ${g.target} ${pluralWord(U)}.`}; } return null; },
      stats(pid, gs){ const R = drC(pid, gs); if(!R.length) return null; const w = R.filter(x => x.d.won).length;
        return [{label:`${unit} wins`, v:w, best:'high'}, {label:`${unit} win rate`, v:w / R.length, f:'%', best:'high'}, {label:`${pluralWord(unit)} played`, v:R.length}]; },
      score:[[`Winning a ${U}`, '1'], [`Everyone else`, '0']],
      tally:[`After each ${U}, tap who won it.`, t.multi ? `More than one player can win a ${U}.` : `Only one player wins each ${U}.`]};
  }
  if(k === 'order'){
    const series = (t.rounds || 1) > 1, pts = Array.isArray(t.placePts) && t.placePts.length ? t.placePts : [10, 6, 4, 3, 2, 1];
    const val = (place, n) => series ? (pts[place - 1] ?? 0) : n - place + 1;
    return {...base, noQuick:true, entry:'tap', low:false,
      fields:() => [{k:'place', type:'tog', label:'Place'}],
      tapMark:(d) => d && d.place ? ordinal(d.place) : '',
      tap(g, D, p){
        const cur = D[p].place;
        if(cur){ g.players.forEach(q => { if(D[q].place > cur) D[q].place--; }); D[p].place = 0; }
        else D[p].place = Math.max(0, ...g.players.map(q => D[q].place || 0)) + 1;
        const open = g.players.filter(q => !D[q].place); if(open.length === 1 && g.players.length > 1) D[open[0]].place = g.players.length;
      },
      compute(g, D){ const n = g.players.length, scores = {}, detail = {};
        const open = g.players.filter(p => !D[p].place);
        g.players.forEach(p => { const pl = D[p].place || n; scores[p] = val(pl, n); detail[p] = {place:pl}; });
        return {scores, detail, err:open.length ? 'Tap players in the order they finished.' : null}; },
      disp:(v, r, p) => r && r.detail && r.detail[p] ? ordinal(r.detail[p].place) : String(v),
      big:series ? null : (g, pid) => { const r = g.rounds[0]; return r && r.detail && r.detail[pid] ? ordinal(r.detail[pid].place) : '–'; },
      scoreLabel:(g, n) => series ? `Results for ${unit} ${n + 1}` : 'Enter Results',
      sub:(g, pid, total) => series ? `${total} ${base.ptsWord.toLowerCase()}` : (g.rounds.length ? 'Finished' : 'Waiting for results'),
      stats(pid, gs){ const R = drC(pid, gs); if(!R.length) return null;

      fields:(g, pid) => livesLeft(g, pid) <= 0 ? [] : [{k:'lost', type:'step', min:-N, max:N, label:`${lw} lost`}],

      sub:(g, pid) => livesLeft(g, pid) > 0 ? `${livesLeft(g, pid)} of ${N} ${(livesLeft(g, pid) === 1 ? lwS : lw).toLowerCase()} left` : `Out in ${unit} ${outAt(g, pid)}`,
      progress:(g, pid) => Math.max(0, livesLeft(g, pid)) / N,
      end(g){ if(!g.rounds.length) return null; const alive = g.players.filter(p => livesLeft(g, p) > 0);

      disp:v => v > 0 ? '−' + v : v < 0 ? '+' + (-v) : '·',

      score:[[`Each player starts with`, `${N} ${lw.toLowerCase()}`], [`Out at`, `0 ${lw.toLowerCase()}`], ['Winner', 'Last one standing']],

      tally:[`After each ${U}, enter each player’s bid and how many they won.`, 'Green under a score means the bid was made.']};
  }

  return {...base, kind:'points',
    tally:[`After each ${U}, enter every player’s ${base.ptsWord.toLowerCase()}.`, `Tap any ${U} in the score sheet to change it.`]};
}

   ====================================================================== */
const TMR = {gid:null, total:0, left:0, endAt:0, run:false, iv:null, done:false};
const fmtT = s => { s = Math.ceil(s); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
function resetTimer(gid, secs){ clearInterval(TMR.iv); Object.assign(TMR, {gid, total:secs, left:secs, run:false, done:false, iv:null}); }
function timerCard(g, secs, unit){
  if(TMR.gid !== g.id || TMR.total !== secs) resetTimer(g.id, secs);
  const label = TMR.done ? 'Time\u2019s up!' : TMR.run ? 'Running' : TMR.left < TMR.total ? 'Paused' : 'Timer';
  return `<div class="timer-card ${TMR.done ? 'up' : ''} ${TMR.run ? 'run' : ''}" id="tmCard"><div class="tm-ring" id="tmRing" style="--p:${(TMR.left / TMR.total).toFixed(4)}"><span id="tmTime">${fmtT(TMR.left)}</span></div><div class="grow"><div class="t1" id="tmLabel">${label}</div><div class="t2">${fmtT(TMR.total)} per ${unit.toLowerCase()}</div></div><button class="pill" data-a="tmgo">${TMR.run ? 'Pause' : TMR.done ? 'Again' : TMR.left < TMR.total ? 'Resume' : 'Start'}</button><button class="tool-btn" data-a="tmreset" aria-label="Reset timer"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5"/></svg></button></div>`;
}
function timerTick(){
  TMR.left = Math.max(0, (TMR.endAt - Date.now()) / 1000);
  const tt = $('#tmTime'), ring = $('#tmRing');
  if(tt) tt.textContent = fmtT(TMR.left); if(ring) ring.style.setProperty('--p', (TMR.left / TMR.total).toFixed(4));
  if(TMR.left <= 0){ clearInterval(TMR.iv); TMR.run = false; TMR.done = true; sfx('alarm'); buzz([200, 100, 200, 100, 300]); render(); }
}
function timerGo(){
  if(TMR.run){ clearInterval(TMR.iv); TMR.run = false; TMR.left = Math.max(0, (TMR.endAt - Date.now()) / 1000); render(); return; }
  if(TMR.done){ TMR.left = TMR.total; TMR.done = false; }
  TMR.endAt = Date.now() + TMR.left * 1000; TMR.run = true; clearInterval(TMR.iv); TMR.iv = setInterval(timerTick, 200); render(); sfx('step');
}

  if(c.kind === 'order'){ d.rounds = 1; if(c.series){ const v = posInt(c.orderN, 2, 50); if(v == null) return {err:'Rounds should be 2 to 50.'}; d.rounds = v;
      const pts = String(c.placePts).split(/[,\s]+/).filter(Boolean).map(Number); if(!pts.length || pts.some(x => !Number.isFinite(x))) return {err:'Place points should be numbers, like 10, 6, 4.'}; d.placePts = pts.slice(0, 20).map(Math.round); } }

  if(c.kind === 'bid'){ const r = posInt(c.bidN, 1, 50), b = posInt(c.bidBase, 0, 1000), p = posInt(c.bidPer, 0, 1000), n = posInt(c.bidPen, 0, 1000);

function saveBuilt(){
  const c = ui.cr, res = crToDef(); if(res.err) return toast(res.err);
  const d = res.d, old = c.edit ? S.customs.find(t => t.id === c.edit) : null;
  d.gid = old ? (old.gid || old.id.slice(2)) : uid().replace(/[^a-z0-9]/g, ''); d.created = old ? (old.created || Date.now()) : Date.now();
  const t = tplFrom(d, c.share ? CM.me : undefined); if(!c.share){ delete t.by; t.community = false; }
  if(old) Object.keys(old).forEach(k => delete old[k]), Object.assign(old, t); else { S.customs.push(t); S.added.push(t.id); }
  save();
  if(c.share){
    const cg = cleanGame(d), rest = CM.mine.games.filter(x => x.gid !== d.gid);

}
// Logos are cropped square and kept small so they can be shared
function loadLogo(file){
  if(!file || !file.type.startsWith('image/')) return toast('That file isn’t an image');
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = () => {
    const side = Math.min(img.naturalWidth, img.naturalHeight), size = 128, cv = document.createElement('canvas'); cv.width = cv.height = size;
    const x = cv.getContext('2d'); x.fillStyle = ui.cr.color; x.fillRect(0, 0, size, size);
    x.drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, size, size);
    URL.revokeObjectURL(url); ui.cr.logo = cv.toDataURL('image/jpeg', .8); render();
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('Couldn’t open that image.'); };
  img.src = url;
}

/* backup + restore */
async function backup(){
  const c = window.claude, dl = c && typeof c.use === 'function' ? await c.use('downloads').catch(() => null) : null;
  const d = new Date(), stamp = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const name = `tally-backup-${stamp}.json`, body = JSON.stringify({app:'Tally', format:1, exported:Date.now(), data:S});
  if(!dl){
    const file = new File([body], name, {type:'application/json'});
    // On a phone, open the share sheet so the backup can go to Files, iCloud Drive or a message
    if(navigator.canShare && navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file], title:'Tally backup'}); toast('Backup ready'); }catch(e){} return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); return toast('Backup saved');
  }
  try{
    await dl.save({filename:name, data:body});
    toast('Backup saved');
  }catch(e){
    if(e && e.code === 'declined') return;
    toast(e && e.code === 'rate_limited' ? 'A save is already open. Try again in a moment.' : 'Couldn’t save the backup here.');
  }
}
function restoreFile(file){
  if(!file) return;
  const r = new FileReader();
  r.onload = () => {
    let obj; try{ obj = JSON.parse(r.result); }catch(e){ return toast('That file isn’t a Tally backup.'); }
    const d = obj && obj.app === 'Tally' && obj.data;
    if(!d || !Array.isArray(d.players) || !Array.isArray(d.games)) return toast('That file isn’t a Tally backup.');
    const when = new Date(obj.exported || Date.now()).toLocaleDateString(undefined, {month:'long', day:'numeric', year:'numeric'});
    confirmSheet('Restore this backup?', `It has ${plural(d.players.length, 'player')} and ${plural(d.games.length, 'game')}, saved ${when}. Everything on this phone now will be replaced.`, 'Restore', () => {
      S = d; S.customs = S.customs || []; migrate(); S.settings = {...DEFAULT_SETTINGS, ...(S.settings || {})}; save(); applyTheme(); ui.stack = []; go(); toast('Backup restored');
    });
  };
  r.onerror = () => toast('Couldn’t read that file.');
  r.readAsText(file);
}

/* sounds + haptics */
let AC = null;
function tone(freq, dur, when = 0, type = 'sine', vol = .1){
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if(AC.state === 'suspended') AC.resume();
    const t0 = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .012); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0 + dur + .02);
  }catch(e){}
}
const SFX = {
  save:() => { tone(660, .09); tone(990, .12, .07); },
  step:() => tone(520, .05, 0, 'sine', .04),
  lead:() => { tone(784, .1, 0, 'triangle'); tone(1047, .16, .09, 'triangle'); },
  splash:() => { tone(260, .1, 0, 'sawtooth', .05); tone(130, .45, .05, 'triangle', .1); tone(90, .5, .12, 'sine', .08); },
  alarm:() => { [0, .28, .56].forEach(w => tone(880, .2, w, 'square', .08)); tone(660, .5, .9, 'square', .07); },
  win:() => { [523, 659, 784, 1047].forEach((f, i) => tone(f, .2, i * .11, 'triangle', .12)); tone(1319, .5, .46, 'triangle', .1); }
};
const sfx = name => { if(SET().sound && SFX[name]) SFX[name](); };
const buzz = p => { if(SET().haptics && navigator.vibrate) try{ navigator.vibrate(p); }catch(e){} };

/* keep screen awake while a game is open */
let WL = null;
function syncWake(){
  const top = ui.stack[ui.stack.length - 1];
  const want = SET().awake && top && top.type === 'play' && document.visibilityState === 'visible';
  if(want && !WL && navigator.wakeLock){ WL = 'pending'; navigator.wakeLock.request('screen').then(l => { WL = l; l.addEventListener('release', () => { WL = null; }); }).catch(() => { WL = null; }); }
  else if(!want && WL && WL !== 'pending'){ WL.release().catch(() => {}); WL = null; }
}
document.addEventListener('visibilitychange', () => syncWake());

/* ======================================================================
   REPLAY — the game, round by round, as a race (or an escape from lava when low scores win)
   ====================================================================== */
function replayable(g){ return g && !g.card && g.rounds.length >= 2 && g.players.length >= 2; }
function replayData(g){
  const R = g.rounds.length, E = eng(g), P = g.players;
  const cum = {}, done = {}; P.forEach(p => { cum[p] = 0; done[p] = 0; });
  const frames = [];
  const value = p => g.tid === 'phase10' ? done[p] * 1000 - cum[p] : g.low ? -cum[p] : cum[p];
  const snap = (r, delta) => {
    const v = {}; P.forEach(p => v[p] = value(p));
    const top = Math.max(...P.map(p => v[p]));
    const leaders = P.filter(p => v[p] === top);
    frames.push({r, tot:{...cum}, v, leaders, delta:delta || {}, phase:{...done}});
  };
  snap(0);
  g.rounds.forEach((rd, i) => {
    const d = {};
    P.forEach(p => { const s = rd.scores[p] || 0; d[p] = s; cum[p] += s; if(rd.detail && rd.detail[p] && rd.detail[p].made) done[p]++; });
    snap(i + 1, d);
  });
  // ---- where everyone stands ----
  // hang: lowest-score games and lives games. Players hang over lava; points (or lost lives) lower them.
  // target: first to a score. Distance = how close you are to that score.
  // pace: most points after the rounds. The leader sets the pace and crosses the line on the last round;
  //       everyone else is behind in proportion to their points.
  const mode = (E.kind === 'lives' || (g.low && g.tid !== 'phase10')) ? 'hang' : g.tid === 'phase10' ? 'phase' : (!g.low && g.target != null) ? 'target' : 'pace';
  if(mode === 'hang'){
    const N = g.lives || 3, maxTot = Math.max(1, ...frames.flatMap(f => P.map(p => f.tot[p])));
    const scale = E.kind === 'lives' ? N : g.target != null ? Math.max(1, g.target) : maxTot;
    frames.forEach(f => { f.depth = {}; f.out = {}; P.forEach(p => { f.depth[p] = clamp(f.tot[p] / scale, -.25, 1); if(E.kind === 'lives' && f.tot[p] >= N) f.out[p] = true; }); });
  } else {
    frames.forEach((f, i) => {
      f.pos = {};
      if(mode === 'phase') P.forEach(p => f.pos[p] = f.phase[p] / 10);
      else if(mode === 'target') P.forEach(p => f.pos[p] = f.tot[p] / g.target);
      else {
        const top = Math.max(...P.map(p => f.tot[p])), lead = P.filter(p => f.tot[p] === top);
        let leadX = f.r / R;
        // If the leader lost points this round, they hold their spot instead of moving up
        if(i && lead.every(p => f.delta[p] < 0)) leadX = Math.min(leadX, Math.max(...lead.map(p => frames[i - 1].pos[p])));
        if(top > 0) P.forEach(p => f.pos[p] = leadX * f.tot[p] / top);
        else { const spread = Math.max(1, ...frames.flatMap(x => P.map(p => Math.abs(x.tot[p])))); P.forEach(p => f.pos[p] = leadX - (top - f.tot[p]) / spread); }
        // A round that loses points never moves you forward
        if(i) P.forEach(p => { if(f.delta[p] < 0) f.pos[p] = Math.min(f.pos[p], frames[i - 1].pos[p]); });
      }
      P.forEach(p => f.pos[p] = Math.min(f.pos[p], 1.08));
    });
    const lastF = frames[frames.length - 1];
    standings(g).filter(r => r.place === 1).forEach(r => lastF.pos[r.pid] = Math.max(lastF.pos[r.pid], 1.06));
  }
  // callouts
  const avgAbs = g.rounds.reduce((s, rd) => s + P.reduce((a, p) => a + Math.abs(rd.scores[p] || 0), 0), 0) / (R * P.length) || 1;
  frames.forEach((f, i) => {
    if(i === 0){ f.call = 'Everyone starts level.'; return; }
    const prev = frames[i - 1];
    if(f.leaders.length === 1 && (prev.leaders.length !== 1 || prev.leaders[0] !== f.leaders[0]) && i > 1){ f.call = `${pname(f.leaders[0])} takes the lead!`; f.lead = true; return; }
    if(g.tid === 'phase10'){ const made = P.filter(p => f.phase[p] > prev.phase[p]); if(made.length === 1){ f.call = `${pname(made[0])} completes Phase ${f.phase[made[0]]}.`; return; } }
    const best = P.slice().sort((a, b) => g.low ? f.delta[a] - f.delta[b] : f.delta[b] - f.delta[a])[0];
    const worst = P.slice().sort((a, b) => g.low ? f.delta[b] - f.delta[a] : f.delta[a] - f.delta[b])[0];
    if(!g.low && f.delta[best] >= avgAbs * 1.8 && f.delta[best] > 0) f.call = `Huge ${(E.unit || 'round').toLowerCase()} for ${pname(best)}: ${signed(f.delta[best])}`;
    else if(g.low && f.delta[worst] >= avgAbs * 2 && f.delta[worst] > 0) f.call = `Ouch, ${pname(worst)} takes ${f.delta[worst]}.`;
    else if(g.low && f.delta[best] === 0 && P.filter(p => f.delta[p] === 0).length === 1) f.call = `${pname(best)} scores a clean 0.`;
    else if(f.leaders.length > 1) f.call = `${listNames(f.leaders)} are tied for the lead.`;
    else f.call = `${pname(f.leaders[0])} leads by ${Math.abs(Math.round(f.v[f.leaders[0]] - Math.max(...P.filter(p => p !== f.leaders[0]).map(p => f.v[p]))))}${g.tid === 'phase10' ? '' : ''}.`;
  });
  const last = frames[frames.length - 1];
  const st = standings(g); last.call = `${listNames(st.filter(r => r.place === 1).map(r => r.pid))} win${st.filter(r => r.place === 1).length > 1 ? '' : 's'}!`;
  if(mode === 'hang'){
    const lives = E.kind === 'lives', lw = (E.livesWord || 'Lives').toLowerCase(), lw1 = lw.replace(/ies$/, 'y').replace(/s$/, '');
    frames.forEach((f, i) => {
      if(i === 0){ f.call = lives ? `Everyone starts with ${g.lives || 3} ${lw}. Run out and you drop.` : 'Every point lowers you toward the lava.'; return; }
      if(i === R) return;
      const prev = frames[i - 1], newOut = lives ? P.filter(p => f.out[p] && !prev.out[p]) : [];
      const worst = P.slice().sort((a, b) => f.delta[b] - f.delta[a])[0];
      if(newOut.length) f.call = `${listNames(newOut)} ${newOut.length > 1 ? 'fall' : 'falls'} into the lava!`;
      else if(f.lead) f.call = `${pname(f.leaders[0])} is hanging highest now!`;
      else if(lives && f.delta[worst] > 0){ f.hit = worst; const l = P.filter(p => f.delta[p] > 0); f.call = l.length > 1 ? `${listNames(l)} each drop lower.` : `${pname(worst)} loses ${f.delta[worst] === 1 ? 'a ' + lw1 : f.delta[worst] + ' ' + lw}.`; }
      else if(!lives && f.delta[worst] >= avgAbs * 2 && f.delta[worst] > 0){ f.hit = worst; f.call = `${pname(worst)} slips down: +${f.delta[worst]}`; }
      else if(/clean 0/.test(f.call || '')) f.call = `${pname(P.find(p => f.delta[p] === 0))} holds steady with a 0.`;
      else if(f.leaders.length > 1) f.call = `${listNames(f.leaders)} are hanging level.`;
      else f.call = `${pname(f.leaders[0])} is hanging highest.`;
    });
    last.call = 'Hold on…';
  }
  // Phase 10 leads are about phases, not points
  if(g.tid === 'phase10') frames.forEach(f => { if(/leads by/.test(f.call || '')) f.call = `${pname(f.leaders[0])} is out in front on Phase ${Math.min(10, f.phase[f.leaders[0]] + 1)}.`; });
  return {frames, R, st, mode};
}

const RP = {timer:null, timers:[], i:0, data:null, gid:null, then:null};
function openReplay(gid, then){
  const g = S.games.find(x => x.id === gid); if(!replayable(g)) return then && then();
  RP.timers.forEach(clearTimeout); RP.timers = []; clearTimeout(RP.hide);
  RP.gid = gid; RP.then = then || null; RP.data = replayData(g); RP.i = 0;
  const el = $('#replay'); el.hidden = false; el.innerHTML = replayShell(g);
  document.body.classList.add('noscroll');
  requestAnimationFrame(() => { drawFrame(0, true); requestAnimationFrame(() => el.classList.add('on')); });
  clearTimeout(RP.timer); RP.timer = setTimeout(stepReplay, 900);
}
const reduceMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const stepMs = () => clamp(Math.round(15000 / RP.data.R), 480, 1150);
function stepReplay(){
  if(RP.i >= RP.data.frames.length - 1) return finishReplay();
  RP.i++; drawFrame(RP.i);
  const f = RP.data.frames[RP.i];
  if(RP.i === RP.data.frames.length - 1) return finishReplay();
  if(f.lead){ sfx('lead'); buzz(12); } else sfx('step');
  RP.timer = setTimeout(stepReplay, f.lead ? stepMs() + 450 : stepMs());
}
const isLava = g => (g.low && g.tid !== 'phase10') || eng(g).kind === 'lives';
function replayShell(g){
  const t = tmpl(g.tid), hang = RP.data.mode === 'hang';
  return `<div class="rp-top"><div class="grow"><div class="eyebrow">${esc(t.name)} · ${hang ? 'Over the Lava' : 'The Race'}</div><div class="rp-round" id="rpRound"></div></div><button class="rp-skip" data-a="rpskip">Skip</button></div>
    <div class="rp-stage" id="rpStage" style="--ms:${stepMs()}ms">${hang ? hangStage(g) : raceStage(g)}</div>
    <div class="rp-call" id="rpCall" aria-live="polite"></div>
    <div class="rp-bar ${hang ? 'hot' : ''}"><i id="rpBar"></i></div>
    <div class="rp-end" id="rpEnd" hidden><button class="btn secondary" data-a="rpagain">Watch Again</button><button class="btn primary" data-a="rpdone">Continue</button></div>`;
}
function tokenHtml(pid){
  return `<div class="tok" data-pid="${pid}"><span class="tok-score" data-score="${pid}">0</span>${avatar(pid)}<span class="tok-name">${esc(pname(pid))}</span></div>`;
}
const LEFT_ARROW = '<svg viewBox="0 0 10 12" width="9" height="11" aria-hidden="true"><path d="M8.5 1L2 6l6.5 5z" fill="currentColor"/></svg>';
function raceStage(g){
  const n = g.players.length, lane = n > 5 ? 54 : 66;
  return `<div class="track ${n > 5 ? 'sm' : ''}" style="--lane:${lane}px">${g.players.map(p => `<div class="lane">${tokenHtml(p)}<div class="offarrow" data-off="${p}" hidden>${LEFT_ARROW}<span>${esc(pname(p).split(' ')[0])}</span><b data-offs="${p}"></b></div></div>`).join('')}</div>`;
}
function hangStage(g){
  const n = g.players.length;
  const bubbles = Array.from({length:10}, (_, k) => `<i style="left:${(6 + k * 9.5).toFixed(1)}%;top:${30 + (k * 23) % 50}%;animation-delay:${(k * .41 % 2.2).toFixed(2)}s;--s:${5 + (k * 5) % 8}px"></i>`).join('');
  return `<div class="hang ${n > 5 ? 'sm' : ''}"><div class="beam" aria-hidden="true"></div>
    ${g.players.map((p, i) => `<div class="hp" data-pid="${p}" style="--cx:${((i + .5) / n * 100).toFixed(2)}%"><i class="rope"></i>${tokenHtml(p)}</div>`).join('')}
    <div class="pool" aria-hidden="true"><div class="pool-surf"></div><div class="bubbles">${bubbles}</div></div></div>`;
}
const scoreText = (g, f, p) => g.tid === 'phase10' ? `Ph ${Math.min(10, f.phase[p] + 1)}` : eng(g).kind === 'lives' ? `${Math.max(0, (g.lives || 3) - f.tot[p])} ♥` : fmt(f.tot[p]);
function drawFrame(i, instant){
  const g = S.games.find(x => x.id === RP.gid), f = RP.data.frames[i], E = eng(g), unit = E.unit || 'Round', R = RP.data.R, P = g.players, hang = RP.data.mode === 'hang';
  const stage = $('#rpStage'); if(!stage) return;
  stage.classList.toggle('instant', !!instant || reduceMotion());
  $('#rpRound').textContent = i === 0 ? 'Ready…' : i === R ? 'Final result' : `${unit} ${i} of ${R}`;
  $('#rpBar').style.width = (i / R * 100) + '%';
  const call = $('#rpCall'); call.textContent = f.call || ''; call.classList.remove('pop'); void call.offsetWidth; call.classList.add('pop'); call.classList.toggle('lead', !!f.lead || (i === R && !hang));
  P.forEach(p => {
    const tok = stage.querySelector(`.tok[data-pid="${p}"]`); if(!tok) return;
    tok.classList.toggle('leading', i > 0 && f.leaders.includes(p) && !(hang && f.out[p]));
    tok.classList.toggle('winner', !hang && i === R && RP.data.st.find(r => r.pid === p).place === 1);
    if(f.hit === p && !instant){ tok.classList.remove('hit'); void tok.offsetWidth; tok.classList.add('hit'); }
    const sc = stage.querySelector(`[data-score="${p}"]`); if(sc) sc.textContent = scoreText(g, f, p);
    if(hang){
      const hp = tok.parentElement, was = hp.classList.contains('fell');
      hp.style.setProperty('--ty', (22 + f.depth[p] * 40).toFixed(2) + '%');
      hp.classList.toggle('fell', !!f.out[p]);
      if(f.out[p] && !was && !instant) dropFx(p, hp);
    } else {
      tok.style.setProperty('--x', f.pos[p].toFixed(4));
      // Below zero: the player runs off the left edge and an arrow shows where they went
      const off = stage.querySelector(`[data-off="${p}"]`), os = stage.querySelector(`[data-offs="${p}"]`);
      if(off){ off.hidden = f.pos[p] > -.03; if(os) os.textContent = scoreText(g, f, p); }
    }
  });
}
function dropFx(p, hp){
  sfx('splash'); buzz(30);
  RP.timers.push(setTimeout(() => {
    const st = $('#rpStage .hang'); if(!st) return;
    const sp = document.createElement('div'); sp.className = 'splash'; sp.style.left = hp.style.getPropertyValue('--cx');
    sp.innerHTML = '<i></i><i></i><i></i><i></i><i></i>'; st.appendChild(sp); setTimeout(() => sp.remove(), 900);
  }, reduceMotion() ? 0 : 520));
}
function endReplayUI(){
  $('#rpEnd').hidden = false; const sk = $('.rp-skip'); if(sk) sk.hidden = true;
  sfx('win'); buzz([20, 60, 30]);
  if(!reduceMotion()) confetti();
}
function finishReplay(){
  clearTimeout(RP.timer); RP.timers.forEach(clearTimeout); RP.timers = [];
  RP.i = RP.data.frames.length - 1; drawFrame(RP.i);
  if(RP.data.mode !== 'hang') return endReplayUI();
  // Everyone but the winner lets go, worst first
  const last = RP.data.frames[RP.i], W = RP.data.st.filter(r => r.place === 1).map(r => r.pid);
  const losers = RP.data.st.filter(r => !W.includes(r.pid) && !last.out[r.pid]).map(r => r.pid).reverse();
  const gap = reduceMotion() ? 60 : 480, stage = $('#rpStage');
  losers.forEach((p, k) => RP.timers.push(setTimeout(() => {
    const hp = stage && stage.querySelector(`.hp[data-pid="${p}"]`); if(!hp) return;
    stage.classList.remove('instant'); hp.classList.add('fell'); dropFx(p, hp);
    $('#rpCall').textContent = `${pname(p)} falls in!`;
  }, 650 + k * gap)));
  RP.timers.push(setTimeout(() => {
    W.forEach(p => { const tok = stage && stage.querySelector(`.tok[data-pid="${p}"]`); if(tok) tok.classList.add('winner'); });
    const call = $('#rpCall'); if(call){ call.textContent = `${listNames(W)} survive${W.length > 1 ? '' : 's'} the lava!`; call.classList.add('lead'); }
    endReplayUI();
  }, 650 + losers.length * gap + 600));
}
function confetti(){
  const stage = $('#rpStage'); if(!stage) return;
  const box = document.createElement('div'); box.className = 'confetti';
  const cols = COLORS.concat(['#FFCC00']);
  for(let i = 0; i < 46; i++){ const s = document.createElement('i'); s.style.left = (Math.random() * 100) + '%'; s.style.background = cols[i % cols.length]; s.style.animationDelay = (Math.random() * .5) + 's'; s.style.setProperty('--dx', (Math.random() * 80 - 40) + 'px'); s.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg'); box.appendChild(s); }
  stage.appendChild(box); setTimeout(() => box.remove(), 2600);
}
function closeReplay(goOn){
  clearTimeout(RP.timer); RP.timers.forEach(clearTimeout); RP.timers = [];
  const el = $('#replay'); el.classList.remove('on'); document.body.classList.remove('noscroll');
  RP.hide = setTimeout(() => { el.hidden = true; el.innerHTML = ''; }, reduceMotion() ? 0 : 220);
  const fn = RP.then; RP.then = null;
  if(goOn && fn) fn();
}

load(); applyTheme(); render(); initCommunity();
</script>
